<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BS Fleet OPS · CMMS — Fleet &amp; Asset Control</title>
<meta name="description" content="Single-file fleet and asset management system: 500+ machines, fuel consumption, spare parts by part number, work orders, preventive maintenance, SOP library, per-machine dossiers and Google Drive backup.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23161B1F'/%3E%3Cpath d='M7 22h18M8 22v-6h16v6M11 16V9h10v7' stroke='%23C0821A' stroke-width='2' fill='none'/%3E%3Ccircle cx='11' cy='24.5' r='2.2' fill='%23C0821A'/%3E%3Ccircle cx='21' cy='24.5' r='2.2' fill='%23C0821A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ============================ TOKENS ============================ */
:root{
  --ink:#161B1F;--ink-2:#1E262C;--ink-3:#2A343B;
  --panel:#FFFFFF;--bg:#F3F4F2;--bg-2:#FAFBFA;
  --line:#DCE0E1;--line-2:#ECEFEF;--line-3:#C9D1D4;
  --text:#1F252A;--muted:#69747C;--muted-2:#8D99A0;
  --steel:#2C363E;--amber:#C0821A;--amber-2:#A26C0F;--amber-3:#F3E7D2;
  --ok:#2E7A46;--ok-bg:#E7F2EA;--warn:#A96A10;--warn-bg:#FAEEDB;--bad:#9E3A2D;--bad-bg:#F7E4E0;
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --r:3px;--rail:248px;
  --sh:0 14px 34px rgba(20,26,31,.13);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;line-height:1.1}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:#F0DCBB}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.small{font-size:12.5px}
.tiny{font-size:11px}
.muted{color:var(--muted)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actcell{text-align:right;white-space:normal;vertical-align:middle}
.actcell .btn{margin:2px 0 2px 4px}
.nowrap{white-space:nowrap}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============================ BUTTONS ============================ */
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line-3);
  background:#fff;border-radius:var(--r);font-size:13px;font-weight:500;color:var(--text);cursor:pointer;
  transition:background .12s,border-color .12s,color .12s;white-space:nowrap}
.btn:hover{background:var(--bg-2);border-color:#AFBBC1}
.btn:active{transform:translateY(1px)}
.btn svg{width:14px;height:14px;stroke:currentColor;flex:none}
.btn-primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-primary:hover{background:var(--ink-3);border-color:var(--ink-3)}
.btn-amber{background:var(--amber);border-color:var(--amber);color:#1B140A}
.btn-amber:hover{background:#CE8E24;border-color:#CE8E24}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:rgba(0,0,0,.04);color:var(--text)}
.btn-sm{height:27px;padding:0 9px;font-size:12px;gap:4px}
.btn-sm svg{width:12px;height:12px}
.btn-danger{color:var(--bad);border-color:#E3C7C1}
.btn-danger:hover{background:var(--bad-bg);border-color:#D3A79E}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.x-btn{width:30px;height:30px;display:grid;place-items:center;border:0;background:transparent;cursor:pointer;border-radius:var(--r);color:var(--muted)}
.x-btn:hover{background:var(--bg);color:var(--text)}
.x-btn svg{width:15px;height:15px;stroke:currentColor}

/* ============================ SHELL / RAIL ============================ */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;background:var(--ink);color:#D9DFE2;display:flex;flex-direction:column;z-index:40}
.rail-brand{display:flex;align-items:center;gap:10px;padding:16px 18px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.rail-mark{width:30px;height:30px;flex:none;display:grid;place-items:center;background:var(--amber);border-radius:2px}
.rail-mark svg{width:18px;height:18px;stroke:#1B140A}
.rail-brand-txt{min-width:0}
.rail-name{font-family:var(--f-display);font-size:20px;font-weight:600;color:#fff;letter-spacing:.01em;line-height:1}
.rail-sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8B989F;margin-top:3px}
.rail-nav{flex:1;overflow-y:auto;padding:10px 0 18px}
.rail-group{padding:12px 18px 6px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7C8990}
.rail-item{display:flex;align-items:center;gap:9px;padding:8px 18px;font-size:13px;color:#C3CCD1;cursor:pointer;border-left:2px solid transparent}
.rail-item:hover{background:rgba(255,255,255,.05);color:#fff}
.rail-item.on{background:rgba(192,130,26,.14);border-left-color:var(--amber);color:#fff}
.rail-item svg{width:15px;height:15px;stroke:currentColor;flex:none;opacity:.85}
.rail-item .count{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;padding:1px 5px;border-radius:2px;background:rgba(255,255,255,.11);color:#DDE3E6}
.rail-item .count.alert{background:var(--bad);color:#fff}
.rail-foot{border-top:1px solid rgba(255,255,255,.07);padding:12px 16px}
.rail-user{display:flex;align-items:center;gap:9px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--ink-3);color:#E7D3B2;display:grid;place-items:center;font-family:var(--f-display);font-size:14px;font-weight:600;flex:none}
.rail-user-name{font-size:12.5px;color:#E7ECEE;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail-user-role{font-size:10.5px;color:#8B989F;margin-top:2px}
.rail-foot .btn{width:100%;margin-top:10px;background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);color:#C3CCD1;justify-content:center}
.rail-foot .btn:hover{background:rgba(255,255,255,.12);color:#fff}

/* ============================ TOPBAR / VIEW ============================ */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:0 22px;height:56px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.topbar .rail-toggle{display:none}
.search-box{position:relative;flex:1;max-width:420px}
.search-box svg{position:absolute;left:9px;top:9px;width:14px;height:14px;stroke:var(--muted-2)}
.search-box input{width:100%;height:32px;padding:0 10px 0 30px;border:1px solid var(--line);background:var(--bg-2);border-radius:var(--r);font-size:13px}
.search-box input:focus{background:#fff;border-color:var(--line-3);outline:0}
.topbar-spacer{flex:1}
.topbar-org{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.topbar-org .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.view{padding:22px 24px 60px;min-width:0}
.view-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.view-title{font-size:30px;color:var(--ink)}
.view-sub{font-size:12.5px;color:var(--muted);margin-top:4px;max-width:70ch}
.view-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ============================ PANEL / GRID ============================ */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.panel-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.panel-title{font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:.01em}
.panel-title .sub{font-family:var(--f-body);font-size:11.5px;font-weight:400;color:var(--muted);margin-left:8px}
.panel-body{padding:16px}
.panel-foot{padding:10px 16px;border-top:1px solid var(--line-2);background:var(--bg-2);font-size:12px;color:var(--muted)}
.g-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.g-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
.dash-col{min-width:0;display:flex;flex-direction:column;gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.section-gap{margin-top:14px}

/* ============================ KPI ============================ */
.kpi-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.kpi-strip.eight{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:13px 15px;border-right:1px solid var(--line-2);min-width:0}
.kpi:last-child{border-right:0}
.kpi-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi-value{font-family:var(--f-mono);font-size:22px;font-weight:600;color:var(--ink);letter-spacing:-.02em;margin-top:6px;line-height:1.1}
.kpi-note{font-size:11px;color:var(--muted-2);margin-top:5px}
.kpi-value.ok{color:var(--ok)}.kpi-value.warn{color:var(--warn)}.kpi-value.bad{color:var(--bad)}
.mini{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.mini-label{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.mini-value{font-family:var(--f-mono);font-size:19px;font-weight:600;margin-top:5px;line-height:1.1}
.mini-note{font-size:11px;color:var(--muted-2);margin-top:4px}
.mini-value.ok{color:var(--ok)}.mini-value.warn{color:var(--warn)}.mini-value.bad{color:var(--bad)}

/* ============================ TABLE ============================ */
.table-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
.tbl thead th{position:sticky;top:0;background:#FAFBFA;border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;
  font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
.tbl thead th.num{text-align:right}
.tbl tbody td{border-bottom:1px solid var(--line-2);padding:9px 10px;vertical-align:middle}
.tbl tbody tr.grp td{border-top:1px solid var(--line)}
.tbl tbody tr:hover{background:#FBFAF6}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .tbl-empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:13px}
.tbl tfoot td{border-top:1px solid var(--line);padding:9px 10px;background:#FAFBFA;font-weight:600}
.row-link{cursor:pointer}
.cell-code{font-family:var(--f-mono);font-size:12.5px;font-weight:500;color:var(--ink)}
.cell-main{font-weight:500;color:var(--ink)}
.cell-sub{font-size:11px;color:var(--muted);margin-top:2px}
.part-cards{display:none}
.pcard{border:1px solid var(--line);background:#fff;padding:10px 11px;border-radius:3px}
.pcard-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.pcard-name{font-size:14px;font-weight:600;color:var(--ink);line-height:1.25}
.pcard-qty{font-family:var(--f-mono);font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.pcard-qty.warn{color:var(--warn)}.pcard-qty.bad{color:var(--bad)}
.pcard-foot{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line-2)}
.loc-line{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.loc{display:inline-flex;align-items:center;gap:5px;padding:1px 5px;border:1px solid var(--line-2);background:#F7F9FA;
  border-radius:2px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);line-height:1.5}
.loc-site{font-family:var(--f-body);font-weight:500;color:var(--steel);white-space:nowrap}
.loc-bin{color:var(--muted-2);white-space:nowrap}
.loc b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.loc-q{padding-left:7px;margin-left:2px;border-left:1px solid var(--line);color:var(--muted-2);white-space:nowrap}
.loc.on{border-color:var(--amber);background:#FBF3E4}
.loc.none{color:var(--muted-2);font-family:var(--f-body);font-size:11px;border-style:dashed}
.loc.more{font-family:var(--f-body)}
.cell-code.link{color:var(--amber-2);cursor:pointer}
.cell-code.link:hover{text-decoration:underline}
.num{white-space:nowrap}

/* ============================ PILLS / TAGS ============================ */
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:2px;font-size:10.5px;font-weight:600;
  letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.pill.act{background:var(--ok-bg);color:var(--ok)}
.pill.idle{background:#E9EEF1;color:#4C5A64}
.pill.mnt{background:var(--warn-bg);color:var(--warn)}
.pill.down{background:var(--bad-bg);color:var(--bad)}
.pill.ret{background:#EFEFED;color:#767B7C}
.tag{display:inline-flex;align-items:center;height:19px;padding:0 6px;border:1px solid var(--line);border-radius:2px;font-size:10.5px;color:var(--muted);white-space:nowrap}
.tag.ok{border-color:#BFD9C7;background:var(--ok-bg);color:var(--ok)}
.tag.warn{border-color:#E7CFA5;background:var(--warn-bg);color:var(--warn)}
.tag.bad{border-color:#E0BFB8;background:var(--bad-bg);color:var(--bad)}
.tag.dark{background:var(--ink);border-color:var(--ink);color:#E7ECEE}
.dot-s{width:6px;height:6px;border-radius:50%;display:inline-block;flex:none}
.dot-s.ok{background:var(--ok)}.dot-s.warn{background:var(--warn)}.dot-s.bad{background:var(--bad)}

/* ============================ PASSPORT ============================ */
.passport{background:var(--ink);color:#E7ECEE;border-radius:var(--r);padding:20px 22px;display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.passport-code{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--amber);text-transform:uppercase}
.passport-name{font-family:var(--f-display);font-size:32px;font-weight:600;color:#fff;margin-top:2px;line-height:1.05}
.passport-meta{font-size:12px;color:#9FACB3;margin-top:6px}
.passport-meter{margin-left:auto;text-align:right}
.passport-meter .m-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8B989F}
.passport-meter .m-value{font-family:var(--f-mono);font-size:30px;font-weight:600;color:#fff;line-height:1.05;margin-top:2px}
.passport-meter .m-unit{font-size:11px;color:#9FACB3}
.pstat-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-top:0;background:#fff;border-radius:0 0 var(--r) var(--r);overflow:hidden;margin-bottom:14px}
.pstat{padding:10px 14px;border-right:1px solid var(--line-2);min-width:0}
.pstat:last-child{border-right:0}
.pstat .p-label{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pstat .p-value{font-family:var(--f-mono);font-size:15px;font-weight:600;margin-top:4px;line-height:1.2}
.pstat .p-value.ok{color:var(--ok)}.pstat .p-value.warn{color:var(--warn)}.pstat .p-value.bad{color:var(--bad)}

/* ============================ TABS ============================ */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:9px 14px;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text);background:var(--bg-2)}
.tab.on{color:var(--ink);border-bottom-color:var(--amber);font-weight:600}

/* ============================ FILTER BAR ============================ */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;background:#fff;border:1px solid var(--line);border-bottom:0}
.inp,.sel{height:32px;padding:0 9px;border:1px solid var(--line);border-radius:var(--r);background:#fff;font-size:13px;min-width:0}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--amber);outline:0;box-shadow:0 0 0 2px rgba(192,130,26,.15)}
.ta{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:var(--r);font-size:13px;resize:vertical;line-height:1.5}
.inp::placeholder,.ta::placeholder{color:var(--muted-2)}
.pager{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line-2);background:#fff;font-size:12px;color:var(--muted);flex-wrap:wrap}
.pager .pg{min-width:28px;height:26px;display:grid;place-items:center;border:1px solid var(--line);background:#fff;border-radius:var(--r);font-family:var(--f-mono);font-size:11.5px;cursor:pointer;padding:0 6px}
.pager .pg.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pager .pg:hover:not(.on){background:var(--bg-2)}

/* ============================ FORMS / MODAL ============================ */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
body{zoom:var(--ui-scale,1)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg-btn{border:1px solid var(--line);background:#fff;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer;border-radius:2px;color:var(--muted)}
.seg-btn.on{border-color:var(--amber);background:#FBF3E4;color:var(--ink);font-weight:600}
.rail-scale{display:flex;align-items:center;gap:4px;padding:0 14px 10px;color:#8B989F;font-size:10px}
.rail-scale>span{margin-right:4px}
.scale-btn{border:1px solid #3A464E;background:transparent;color:#AEB9C0;font:inherit;font-size:10px;padding:2px 5px;cursor:pointer;border-radius:2px}
.scale-btn.on{border-color:var(--amber);color:#fff;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.role-block{margin-top:14px;border-top:1px solid var(--line-2);padding-top:12px}
.role-block-title{font-size:12px;font-weight:600;color:var(--ink);margin-bottom:8px}
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.chk{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink);cursor:pointer;min-height:28px}
.chk input{width:15px;height:15px;accent-color:var(--amber)}
.stock-edit{margin-top:14px;border-top:1px solid var(--line-2);padding-top:12px}
.stock-edit-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:13px;font-weight:600}
.stock-total{margin-top:14px;padding-top:8px;border-top:1px solid var(--line-2);font-size:12px;color:var(--ink)}
.stock-add .inp,.stock-add .sel{height:34px}
.part-form{grid-template-columns:repeat(3,1fr)}
@media (max-width:980px){.part-form{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){.part-form{grid-template-columns:1fr}}
.qty-inp{max-width:110px;padding:5px 8px;text-align:right}
.meter-btn{display:block;width:100%;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:right;cursor:pointer}
.meter-btn:hover .mono{color:var(--amber-2)}
.meter-btn .cell-sub{display:block;font-size:10px;font-weight:400;line-height:1.3;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter-btn .mono{font-size:12px}
.stock-add{display:grid;grid-template-columns:31% 41% 28%;gap:10px;margin-top:10px;align-items:end}
.stock-add .field{margin:0}
@media (max-width:760px){.stock-add{grid-template-columns:1fr}}
.form-grid .full{grid-column:1 / -1}
.field{min-width:0}
.field label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field .inp,.field .sel,.field .ta{width:100%}
.field .hint{font-size:11px;color:var(--muted-2);margin-top:4px}
.form-error{background:var(--bad-bg);border:1px solid #E2C3BC;color:var(--bad);padding:8px 10px;border-radius:var(--r);font-size:12.5px;margin-bottom:10px}
.form-ok{background:var(--ok-bg);border:1px solid #C2D9C9;color:var(--ok);padding:8px 10px;border-radius:var(--r);font-size:12.5px}
.info-box{background:#F7F9FA;border:1px solid var(--line);border-left:2px solid var(--amber);padding:10px 12px;font-size:12.5px;color:#3A464E;line-height:1.55}
.info-box b{color:var(--ink)}
.modal-back{position:fixed;inset:0;z-index:70;background:rgba(18,23,27,.46);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{width:100%;max-width:540px;background:#fff;border-radius:var(--r);box-shadow:var(--sh);animation:pop .16s ease-out;max-height:calc((100vh / var(--ui-scale,1)) - 90px);display:flex;flex-direction:column}
.modal-body{flex:1 1 auto;min-height:0}
.modal.wide{max-width:800px}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-title{font-family:var(--f-display);font-size:19px;font-weight:600}
.modal-body{padding:16px 18px;max-height:calc(100vh - 210px);overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--bg-2)}
.modal-close{display:none}

/* ============================ TOAST ============================ */
.toast-wrap{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{background:var(--ink);color:#EDF1F2;padding:10px 14px;border-radius:var(--r);font-size:12.5px;box-shadow:var(--sh);
  border-left:2px solid var(--amber);animation:slide .18s ease-out}
.toast.ok{border-left-color:#5FAE7A}
.toast.err{border-left-color:#D2705F}
@keyframes slide{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}

/* ============================ AUTH ============================ */
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 420px;background:var(--ink)}
.auth-left{padding:52px 48px;color:#E7ECEE;display:flex;flex-direction:column;justify-content:center;min-width:0}
.auth-kicker{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber)}
.auth-h1{font-family:var(--f-display);font-size:clamp(34px,4.4vw,58px);line-height:1;color:#fff;margin-top:12px;letter-spacing:-.015em}
.auth-lede{color:#A7B4BB;font-size:14px;margin-top:14px;max-width:46ch;line-height:1.6}
.auth-list{margin-top:26px;display:grid;gap:9px;max-width:44ch}
.auth-list div{display:flex;gap:9px;font-size:12.5px;color:#C6D1D6}
.auth-list svg{width:14px;height:14px;stroke:var(--amber);flex:none;margin-top:2px}
.auth-right{background:#fff;padding:40px 34px;display:flex;flex-direction:column;justify-content:center}
.auth-card{max-width:340px;margin:0 auto;width:100%}
.auth-title{font-family:var(--f-display);font-size:24px}
.auth-sub{font-size:12.5px;color:var(--muted);margin:4px 0 18px}
.auth-card .field{margin-bottom:12px}
.auth-card .btn{width:100%;justify-content:center;height:38px}
.auth-foot{border-top:1px solid var(--line-2);margin-top:18px;padding-top:14px;font-size:11.5px;color:var(--muted)}
.auth-foot code{font-family:var(--f-mono);color:var(--ink)}

/* ============================ CHARTS ============================ */
.chart{width:100%}
.chart svg{display:block;width:100%}
.chart .bar{fill:var(--steel);transition:fill .12s}
.chart .bar:hover{fill:var(--amber)}
.chart .axis{font-family:var(--f-mono);font-size:9.5px;fill:var(--muted-2)}
.chart .grid-line{stroke:var(--line-2);stroke-width:1}
.chart .ln{fill:none;stroke:var(--amber);stroke-width:2}
.chart .pt{fill:var(--amber)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:1px;display:inline-block}

/* ============================ TIMELINE ============================ */
.timeline{position:relative;padding-left:18px}
.timeline::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:1px;background:var(--line)}
.tl-item{position:relative;padding:0 0 14px 0}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-16px;top:3px;width:9px;height:9px;border-radius:50%;background:#fff;border:1px solid var(--line-3)}
.tl-dot.fuel{border-color:var(--steel);background:var(--steel)}
.tl-dot.svc{border-color:var(--amber);background:var(--amber)}
.tl-dot.pm{border-color:#5A8A6B;background:#5A8A6B}
.tl-dot.part{border-color:#8A6A9A;background:#8A6A9A}
.tl-when{font-family:var(--f-mono);font-size:10.5px;color:var(--muted-2)}
.tl-what{font-size:12.5px;margin-top:2px}
.tl-what b{color:var(--ink);font-weight:600}

/* ============================ SOP ============================ */
.sop-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.sop-card{display:flex;flex-direction:column;padding:14px 16px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.sop-card:hover{border-color:#A9B4BC;box-shadow:0 4px 14px rgba(20,26,31,.06)}
.sop-card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}
.sop-card-title{font-family:var(--f-display);font-size:19px;line-height:1.14;font-weight:600}
.sop-card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line-2)}
.sop-detail{padding:2px}
.sop-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.sop-meta .sm{padding:9px 11px;background:#F7F9FA;border:1px solid var(--line)}
.sop-meta .sm .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sop-meta .sm .v{font-size:12.5px;font-weight:500;margin-top:3px}
.sop-steps{counter-reset:st}
.sop-step{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px dotted var(--line)}
.sop-step:last-child{border-bottom:0}
.sop-step .n{font-family:var(--f-mono);font-size:11px;color:var(--amber);padding-top:2px}
.sop-step .a{font-size:13px}
.sop-step .r{font-size:11px;color:var(--muted);margin-top:3px}
.sop-step .r b{color:var(--steel);font-weight:500}

/* SOP document layout (modal view and print sheet) */
.sop-doc{font-size:12.5px;color:var(--ink)}
.sop-doc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:4px}
.sop-sec{margin-top:13px}
.sop-sec-h{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--steel);
  border-bottom:1px solid var(--line);padding-bottom:3px;margin-bottom:6px}
.sop-sec p{margin:0;line-height:1.62}
.sop-num{font-family:var(--f-mono);font-size:11px;color:var(--amber-2);padding-top:2px}
.sop-sign{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:22px}
.sop-sign div{display:flex;align-items:flex-end;gap:6px;font-size:10px;letter-spacing:.04em;color:var(--muted)}
.sig-line{flex:1;border-bottom:1px solid var(--line);height:20px}

/* ============================ REPORT CARDS ============================ */
.rp-card{cursor:pointer}
.rp-card .panel-body{display:flex;flex-direction:column;height:100%}
.rp-card .rp-go{margin-top:auto;padding-top:14px}
.rp-card .panel-body{padding:18px}
.rp-card:hover{border-color:#A9B4BC;box-shadow:0 4px 14px rgba(20,26,31,.06)}
.rp-ico{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);background:#F7F9FA;margin-bottom:12px}
.rp-ico svg{width:18px;height:18px;stroke:var(--steel)}
.rp-card h3{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1.15}
.rp-go{margin-top:14px;font-size:11.5px;color:var(--amber-2);display:flex;align-items:center;gap:4px;font-weight:600}
.rp-go svg{width:13px;height:13px;stroke:currentColor}
.report-feature{display:flex;gap:8px;padding:8px 0;border-bottom:1px dotted var(--line);font-size:12.5px}
.report-feature:last-child{border-bottom:0}
.report-feature .n{font-family:var(--f-mono);font-size:10.5px;color:var(--amber-2);width:16px;flex:none}

/* ============================ PART ROWS (work order form) ============================ */
.part-row{display:grid;grid-template-columns:minmax(0,1fr) 84px 96px 32px;gap:6px;margin-bottom:6px;align-items:center}
.part-row .sel,.part-row .inp{height:30px;font-size:12.5px}
.part-row .btn{justify-content:center;height:30px;padding:0}

/* ============================ EMPTY STATES ============================ */
.empty-state{padding:30px 20px;text-align:center;color:var(--muted)}
.es-title{font-family:var(--f-display);font-size:17px;color:var(--ink);margin-bottom:4px}

/* ============================ REPORT SHEET (print) ============================ */
.report-screen{position:fixed;inset:0;z-index:80;background:#5C6469;overflow-y:auto;padding:0 0 40px}
.report-toolbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--ink);color:#E7ECEE}
.report-toolbar .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#E7ECEE}
.report-toolbar .btn:hover{background:rgba(255,255,255,.18)}
.report-sheet{width:210mm;max-width:100%;margin:20px auto;background:#fff;padding:14mm 14mm 12mm;box-shadow:0 18px 50px rgba(0,0,0,.3);font-size:10.5px;line-height:1.5;color:#1F252A}
.rp-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.rp-org{font-family:var(--f-display);font-size:16px;font-weight:600;letter-spacing:.02em}
.rp-sub{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#69747C;margin-top:1px}
.rp-smallsub{font-size:9px;color:#69747C;margin-top:1px;line-height:1.35}
.rp-title{font-family:var(--f-display);font-size:19px;font-weight:600;text-align:right;line-height:1.1}
.rp-meta{font-size:8.6px;color:#69747C;text-align:right;margin-top:2px}
.rp-asset{display:flex;justify-content:space-between;gap:16px;margin:10px 0 2px;padding:8px 10px;background:#F4F5F3;border:1px solid #DCE0E1}
.rp-asset-code{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;color:var(--amber-2);text-transform:uppercase}
.rp-asset-name{font-family:var(--f-display);font-size:15px;font-weight:600;margin-top:1px}
.rp-asset-right{text-align:right;font-size:9.2px;color:#4A555C;line-height:1.55}
.rp-asset-right b{font-family:var(--f-mono);color:#1F252A}
.rp-section{margin-top:10px;break-inside:avoid}
.rp-section h4{font-family:var(--f-display);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#1F252A;
  border-bottom:1px solid #DCE0E1;padding-bottom:3px;margin-bottom:5px}
.rp-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.rp-kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.rp-kpi{border:1px solid #DCE0E1;padding:5px 7px}
.rp-kpi span{display:block;font-size:8.2px;letter-spacing:.06em;text-transform:uppercase;color:#69747C}
.rp-kpi b{font-family:var(--f-mono);font-size:11.5px}
.rp-tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9px}
.rp-tbl th{background:#F4F5F3;border:1px solid #DCE0E1;padding:3px 4px;text-align:left;font-size:7.8px;letter-spacing:.05em;text-transform:uppercase;color:#4A555C}
.rp-tbl th.num{text-align:right}
.rp-tbl td{border:1px solid #E6E9E9;padding:3px 4px;vertical-align:top}
.rp-tbl tbody tr:nth-child(even) td{background:#FCFCFB}
.rp-note{font-size:9px;color:#4A555C;margin-top:4px;line-height:1.5}
.rp-sign{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px;padding-top:8px;border-top:1px dashed #C9D1D4}
.rp-sign div{font-size:8.6px;color:#69747C;border-top:1px solid #C9D1D4;padding-top:4px;margin-top:26px}
.rp-foot{display:flex;justify-content:space-between;gap:10px;margin-top:14px;padding-top:6px;border-top:1px solid #DCE0E1;font-size:8px;color:#8D99A0}

/* ============================ RESPONSIVE ============================ */
@media (max-width:1180px){
  .kpi-strip{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi-strip.eight{grid-template-columns:repeat(4,minmax(0,1fr))}
  .kpi{border-bottom:1px solid var(--line-2)}
  .g-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dash-grid{grid-template-columns:1fr}
  .sop-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pstat-strip{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pstat{border-bottom:1px solid var(--line-2)}
}
@media (max-width:980px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;width:var(--rail);transform:translateX(-100%);transition:transform .18s ease-out;box-shadow:var(--sh)}
  .rail.open{transform:none}
  .rail-scrim{position:fixed;inset:0;background:rgba(18,23,27,.42);z-index:35}
  .topbar .rail-toggle{display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:var(--r);cursor:pointer}
  .topbar .rail-toggle svg{width:15px;height:15px;stroke:var(--ink)}
  .auth-wrap{grid-template-columns:1fr}
  .auth-left{padding:34px 24px}
  .auth-right{padding:28px 20px}
}
@media (max-width:760px){
  .topbar{padding:0 14px;gap:8px;height:52px}
  .search-box{display:none}
  .view{padding:16px 14px 60px}
  .view-title{font-size:24px}
  .view-actions{margin-left:0;width:100%}
  .view-actions .btn{flex:1;justify-content:center}
  .kpi-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi-strip.eight{grid-template-columns:repeat(2,minmax(0,1fr))}
  .panel-head{flex-wrap:wrap;row-gap:8px}
  .panel-head .panel-title{flex:1 1 100%}
  .panel-head > span[style]{display:none}
  .g-2,.form-grid,.check-grid{grid-template-columns:1fr}
  .g-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-3{grid-template-columns:1fr}
  .rp-cards{grid-template-columns:1fr}
  .report-toolbar{flex-wrap:wrap;row-gap:6px;padding:8px 10px}
  .report-toolbar>div:first-child{flex:1 0 100%;font-size:11px!important;letter-spacing:.04em!important}
  .report-toolbar .btn{padding:5px 8px;font-size:11px}
  .tbl{min-width:840px}
  .hide-sm{display:none}
  .part-cards{display:grid;gap:8px}
  .sop-grid{grid-template-columns:1fr}
  .sop-meta{grid-template-columns:1fr 1fr}
  .passport{padding:16px}
  .passport-name{font-size:26px}
  .passport-meter{margin-left:0;text-align:left}
  .pstat-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filter-bar .inp,.filter-bar .sel{width:100%}
  .report-screen{overflow-x:auto}
  .report-sheet{width:210mm;max-width:none;padding:8mm 6mm;margin:10px auto}
  .rp-kpis,.rp-kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .part-row{grid-template-columns:minmax(0,1fr) 70px 32px}
  .part-row .inp{display:none}
  .modal{max-width:none}
  .modal-back{padding:16px 8px}
  .modal-body{max-height:calc(100vh - 190px)}
  .toast-wrap{left:12px;right:12px;max-width:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
@media print{
  body{zoom:1!important}
  .rail,.topbar,.view-actions,.no-print,.report-toolbar,.toast-wrap,.modal-back,.rail-scrim{display:none!important}
  body.reporting #app{display:none!important}
  body{background:#fff}
  .report-screen{position:static;background:#fff;padding:0;overflow:visible}
  .report-sheet{width:auto;max-width:none;margin:0;padding:0;box-shadow:none}
  .rp-section{break-inside:avoid}
  .rp-tbl{font-size:8.6px}
}

/* ============================ 1. UTILITIES ============================ */
function esc(v) {

function pad2(n) { return n < 10 ? "0" + n : String(n); }
function todayISO() { const d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }

function daysAgo(n) { return addDays(todayISO(), -n); }

function moneyShort(v) {
  if (v === null || v === undefined || v === "" || isNaN(Number(v))) return "—";

function blankDB() {
  return {
    meta: { version: "1.0", createdAt: nowISO(), updatedAt: nowISO(), seeded: false },
    settings: { org: "Fleet Operations", symbol: "Rs.", currency: "NPR", defaultFuelPrice: 168, labourRate: 850, sites: SITES.slice(), departments: DEPTS.slice(), machineTypes: baselineMachineTypes(), pmSoonPercent: 10,
      vendors: [], roles: null, uiScale: 1 },
    users: [], machines: [], fuel: [], parts: [], partSupplies: [], moves: [], services: [], pm: [], pmLog: [], meterLogs: [], sops: [], initiatives: [], audit: []
  };
}
function hydrateDB(parsed) {
  const d = Object.assign(blankDB(), parsed || {});
  d.settings = Object.assign(blankDB().settings, (parsed && parsed.settings) || {});
  ["users", "machines", "fuel", "parts", "partSupplies", "moves", "services", "pm", "pmLog", "meterLogs", "sops", "initiatives", "audit"].forEach(function (k) {
    if (!Array.isArray(d[k])) d[k] = [];
  });
  d.machines.forEach(function (m) {
    if (!m.condition || ASSET_CONDITIONS.indexOf(m.condition) < 0) m.condition = "Good";
    if (typeof m.custodian !== "string") m.custodian = m.operator || "";
    if (typeof m.locationDetail !== "string") m.locationDetail = m.site || "";
    if (typeof m.lastVerified !== "string") m.lastVerified = "";
    if (!m.specs || typeof m.specs !== "object" || Array.isArray(m.specs)) m.specs = {};
    m.meter = Number(m.meter) || 0;
    if (m.meterType !== "KM" && m.meterType !== "Hours") m.meterType = pmUnitKind(m.meterType) === "KM" ? "KM" : "Hours";
  });
  d.pm.forEach(function (p) {
    p.intervalType = pmUnitKind(p.intervalType);
    p.interval = Number(p.interval) || 0;
    p.lastMeter = Number(p.lastMeter) || 0;
    p.nextMeter = p.intervalType === "Days" ? (p.nextMeter || "") : (Number(p.nextMeter) || 0);
    p.active = p.active !== false;
    if (p.intervalType === "Days" && !p.nextDate) p.nextDate = addDays(p.lastDate || todayISO(), p.interval);
  });
  d.pmLog = d.pmLog.filter(function (l) { return l && typeof l === "object" && l.pmId; }).map(function (l) {
    if (!l.id) l.id = uid("pml");
    l.date = String(l.date || "");
    l.intervalType = pmUnitKind(l.intervalType);
    l.interval = Number(l.interval) || 0;
    l.meter = Number(l.meter) || 0;
    l.nextMeter = l.intervalType === "Days" ? String(l.nextMeter || "") : (Number(l.nextMeter) || 0);
    l.cost = Number(l.cost) || 0;
    ["task", "technician", "parts", "notes", "ref", "site", "nextDate", "createdAt"].forEach(function (k) { if (typeof l[k] !== "string") l[k] = ""; });
    return l;
  });
  d.services.forEach(function (s) {
    if (APPROVAL_STATES.indexOf(s.approval) < 0) s.approval = "Approved";
    if (typeof s.approvedBy !== "string") s.approvedBy = s.approval === "Approved" ? "Legacy record" : "";
    if (typeof s.approvedAt !== "string") s.approvedAt = s.approval === "Approved" ? (s.completed || s.date || "") : "";
    if (typeof s.vendorId !== "string") s.vendorId = "";
    if (typeof s.vendorName !== "string") s.vendorName = "";
  });
  d.initiatives.forEach(function (x) {
    if (!x.area || INITIATIVE_AREAS.indexOf(x.area) < 0) x.area = "Other";
    if (!x.status || INITIATIVE_STATES.indexOf(x.status) < 0) x.status = "Planned";

  });

    return s && typeof s === "object" && s.partId;
  }).map(function (s) {
    if (!s.id) s.id = uid("ps");
    s.vendor = String(s.vendor || s.supplier || "").trim();
    s.vendorId = String(s.vendorId || "");
    s.qty = Number(s.qty) || 0;
    s.unitCost = Number(s.unitCost) || 0;
    s.date = String(s.date || "");
    s.site = String(s.site || "");

    s.updatedAt = String(s.updatedAt || s.createdAt);
    return s;
  });
  if (!Array.isArray(d.settings.sites) || !d.settings.sites.length) d.settings.sites = SITES.slice();
  if (!Array.isArray(d.settings.departments) || !d.settings.departments.length) d.settings.departments = DEPTS.slice();
  d.settings.sites = d.settings.sites.map(function (x) { return String(x || "").trim(); }).filter(function (x, i, a) { return x && a.indexOf(x) === i; });
  d.settings.departments = d.settings.departments.map(function (x) { return String(x || "").trim(); }).filter(function (x, i, a) { return x && a.indexOf(x) === i; });
  if (!d.settings.sites.length) d.settings.sites = SITES.slice();
  if (!d.settings.departments.length) d.settings.departments = DEPTS.slice();
  d.settings.machineTypes = normalizeMachineTypes(d.settings.machineTypes);
  d.machines.forEach(function (m) {
    if (!m.type) return;
    const exists = d.settings.machineTypes.some(function (t) { return t.name === m.type; });
    if (!exists) d.settings.machineTypes.push({
      name: m.type, cat: m.category || "Support", meter: m.meterType === "KM" ? "KM" : "Hours",

    if (!scopes.length) {

      const applies = String(s.applies || "").trim();
      scopes = [single || (d.settings.machineTypes.some(function (t) { return t.name === applies; }) ? applies : "All machines")];
    }
    scopes = scopes.filter(function (x) {
      return x === "All machines" || d.settings.machineTypes.some(function (t) { return t.name === x; });
    });
    if (scopes.indexOf("All machines") >= 0) scopes = ["All machines"];
    if (!scopes.length) scopes = ["All machines"];
    s.machineTypes = scopes;
    s.machineType = scopes.length === 1 ? scopes[0] : "";
    if (typeof s.applies !== "string") s.applies = scopes.length === 1 ? scopes[0] : "Multiple machine types";
  });

  if (!Array.isArray(d.settings.vendors) || !d.settings.vendors.length) d.settings.vendors = vendorSeed();
  if (typeof d.settings.uiScale !== "number") d.settings.uiScale = 1;
  if (d.settings.vendors.length && typeof d.settings.vendors[0] === "string") d.settings.vendors = d.settings.vendors.map(function (v) { return { id: uid("v"), name: v, contact: "" }; });
  d.settings.vendors.forEach(function (v) {
    if (!v.kind || VENDOR_KINDS.indexOf(v.kind) < 0) v.kind = "Parts supplier";
    if (!v.scope || VENDOR_SCOPES.indexOf(v.scope) < 0) v.scope = "National";
    if (!v.status || VENDOR_STATUSES.indexOf(v.status) < 0) v.status = "Approved";
    v.rating = Math.max(0, Math.min(5, Number(v.rating) || 0));

/* ============================ 6. SEED DATA ============================ */
function seedDatabase(machineCount, keepUsers) {

  // ---- machines
  const weighted = [];

    const operator = pick(OPERATORS);
    const condition = status === "Breakdown" ? "Poor" : (status === "Under Maintenance" ? "Fair" : (Math.random() < 0.1 ? "Fair" : (Math.random() < 0.04 ? "Poor" : "Good")));
    db.machines.push({

      locationDetail: status === "Under Maintenance" ? "Workshop bay" : pick(["Main yard", "Site yard", "Fuel bay", "Plant area"]),
      lastVerified: daysAgo(rint(4, 190)),
      status: status, fuelType: "Diesel",
      tank: info.cat === "Support" ? 80 : (info.cat === "Transport" ? 300 : 400),
      expCons: info.exp,

      purchaseCost: Math.round(rnd(1200000, 28000000) / 1000) * 1000,
      notes: "",
      createdAt: daysAgo(rint(30, 900)), updatedAt: nowISO()

  }

  // ---- fuel history: 7 entries spread over 300 days
  let basePrice = db.settings.defaultFuelPrice;
  db.machines.forEach(function (m) {
    if (m.status === "Retired") return;

    const entries = 5;
    const totalDelta = isKm ? rint(3200, 11000) : rint(90, 240);
    const start = Math.max(0, m.meter - totalDelta);
    let cursor = start;
    const dates = [];
    for (let i = 1; i <= entries; i++) dates.push(daysAgo(Math.round((300 / entries) * (entries - i)) + rint(0, 4)));
    dates.sort();
    for (let i = 0; i < entries; i++) {
      const part = totalDelta / entries * rnd(0.72, 1.28);
      cursor = Math.min(m.meter, cursor + part);
      const liters = Math.max(1, Math.round(m.expCons * part * rnd(0.86, 1.2) * 10) / 10);
      const price = Math.round((basePrice + rnd(-7, 7)) * 10) / 10;
      db.fuel.push({
        id: uid("f"), machineId: m.id, date: dates[i], liters: liters, unitPrice: price,

  // ---- daily machine logs: seven operational entries per machine over the last 120 days, latest equals current meter
  db.meterLogs = [];

    if (m.status === "Retired") return;

    const total = isKm ? rint(2800, 12000) : rint(70, 300);
    const start = Math.max(0, m.meter - total);
    const days = [120, 90, 60, 30, 7, 3, 1];

    days.forEach(function (d, i) {
      const reading = i === days.length - 1 ? m.meter : Math.round(start + total * ((120 - d) / 120));
      const step = Math.max(1, d > prevD ? 120 - d : prevD - d);

      const cons = Number(m.expCons) || 5;

  db.machines.forEach(function (m) {
    if (m.status === "Retired") return;

    for (let i = 0; i < n; i++) {
      const type = i === n - 1 && m.status === "Breakdown" ? "Breakdown" : (Math.random() > 0.78 ? "Inspection" : (Math.random() > 0.9 ? "Repair" : "Preventive"));
      const d = daysAgo(rint(3, 500));

      for (let j = 0; j < nParts; j++) {
        const cat = pick(["Filters", "Lubricants", "Ground Engaging", "Hydraulics", "Electrical", "Drivetrain", "Tyres", "Engine", m.category === "Concrete" ? "Concrete" : "Filters"]);
        const list = partsByCat[cat] || partsByCat["Filters"];

        used.push({ partId: p.id, qty: qty, unitCost: p.unitCost });
        outByPart[p.id] = (outByPart[p.id] || 0) + qty;
      }

      const status = Math.random() > 0.9 ? "Open" : "Completed";

  // ---- part stock that balances the ledger, split across site stores
  db.parts.forEach(function (p, pi) {

function fuelStats(m, days) {
  const from = days ? daysAgo(days) : "";
  const rows = DB.fuel.filter(function (f) { return f.machineId === m.id && (!from || f.date >= from); });
  rows.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  const liters = sum(rows, function (f) { return f.liters; });
  const cost = sum(rows, function (f) { return f.cost; });
  let cons = 0, dist = 0;
  for (let i = 1; i < rows.length; i++) {
    const d = rows[i].meter - rows[i - 1].meter;
    if (d > 0) { dist += d; cons += rows[i].liters; }
  }
  const rate = dist > 0 ? cons / dist : 0;
  const std = Number(m.expCons) || 0;
  const variance = rate && std ? ((rate - std) / std) * 100 : 0;
  return { rows: rows, liters: liters, cost: cost, dist: dist, cons: rate, std: std, variance: variance, count: rows.length, avgPrice: liters ? cost / liters : 0 };
}

  const direct = DB.moves.filter(function (mv) { return mv.machineId === m.id && mv.type === "OUT" && !mv.serviceId && (!from || mv.date >= from); });

function pmState(p) {
  const m = machineById(p.machineId);
  const soon = (DB.settings.pmSoonPercent || 10) / 100;
  const unit = pmUnitKind(p.intervalType);
  if (unit === "Days") {
    const left = dayDiff(p.nextDate, todayISO());
    if (left < 0) return { state: "overdue", label: Math.abs(left) + " d overdue", left: left, color: "bad" };
    if (left <= Math.max(7, Math.round(p.interval * soon))) return { state: "soon", label: "due in " + left + " d", left: left, color: "warn" };
    return { state: "ok", label: "due in " + left + " d", left: left, color: "ok" };
  }
  const latest = m ? latestMeterLog(m) : null;
  const meter = Math.max(latest ? Number(latest.reading) || 0 : 0, m ? Number(m.meter) || 0 : 0);
  const left = Number(p.nextMeter) - meter;
  if (left < 0) return { state: "overdue", label: Math.abs(left) + (unit === "KM" ? " km overdue" : " h overdue"), left: left, color: "bad" };
  if (left <= Math.max(1, Math.round(p.interval * soon))) return { state: "soon", label: "due in " + left + (unit === "KM" ? " km" : " h"), left: left, color: "warn" };

}
function worstPm(m) {

  if (!list.length) return { state: "none", label: "no plan", color: "muted", left: 0 };
  let worst = { state: "ok", label: "", color: "ok", left: Infinity };
  const rank = { overdue: 2, soon: 1, ok: 0 };
  list.forEach(function (p) {
    const st = pmState(p);
    if (rank[st.state] > rank[worst.state] || (rank[st.state] === rank[worst.state] && st.left < worst.left)) worst = st;
  });

}

function partLocs(p) {

  if (!l) { l = { site: site, bin: bin, qty: 0 }; locs.push(l); }

function fleetStats() {

  const maint = DB.machines.filter(function (m) { return m.status === "Under Maintenance"; }).length;
  const down = DB.machines.filter(function (m) { return m.status === "Breakdown"; }).length;
  const avail = total ? Math.round(((active + idle) / total) * 100) : 0;
  const f30 = DB.fuel.filter(function (f) { return f.date >= daysAgo(30); });

  const cost30 = sum(f30, function (f) { return f.cost; });
  let overdue = 0, soon = 0;
  DB.pm.forEach(function (p) {
    if (!p.active) return;
    const st = pmState(p);
    if (st.state === "overdue") overdue++;

  const lowStock = DB.parts.filter(function (p) { return p.stock <= p.min; }).length;
  const stockValue = sum(DB.parts, function (p) { return p.stock * p.unitCost; });

    sum(DB.moves.filter(function (mv) { return mv.type === "OUT" && !mv.serviceId && mv.date >= from; }), function (mv) { return mv.qty * mv.unitCost; });

    litres30: litres30, cost30: cost30, openWo: openWoCount(""), overdue: overdue, soon: soon,
    lowStock: lowStock, stockValue: stockValue, parts: DB.parts.length, sops: DB.sops.length,

/* ============================ 10. CHARTS (inline SVG) ============================ */
function svgBar(series, opt) {
  opt = opt || {};
  const w = 600, h = opt.height || 170, padB = 20, padT = 12, padL = 4;
  const maxV = Math.max(1, Math.max.apply(null, series.map(function (s) { return s.value; }).concat([0])));
  const n = series.length || 1;
  const gw = (w - padL) / n;
  const bw = Math.min(34, Math.max(6, gw * 0.6));
  let out = '<svg viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none" role="img" aria-label="' + esc(opt.label || "bar chart") + '">';
  [0, 0.5, 1].forEach(function (g) {
    const y = padT + (h - padB - padT) * g;
    out += '<line class="grid-line" x1="0" y1="' + y + '" x2="' + w + '" y2="' + y + '"/>';
  });
  series.forEach(function (s, i) {
    const bh = (h - padB - padT) * (s.value / maxV);
    const x = padL + i * gw + (gw - bw) / 2;
    const y = h - padB - Math.max(1, bh);
    out += '<rect class="bar" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(1, bh).toFixed(1) + '" rx="1"><title>' + esc(s.label) + ": " + num(s.value) + "</title></rect>";
    if (n <= 14) out += '<text class="axis" x="' + (padL + i * gw + gw / 2).toFixed(1) + '" y="' + (h - 6) + '" text-anchor="middle">' + esc(String(s.label).split(" ")[0]) + "</text>";
  });
  out += '<text class="axis" x="' + (w - 2) + '" y="' + (padT - 2) + '" text-anchor="end">' + num(maxV) + "</text>";
  out += "</svg>";
  return '<div class="chart">' + out + "</div>";
}
function svgLine(series, opt) {
  opt = opt || {};
  const w = 600, h = opt.height || 150, padB = 18, padT = 12;
  if (!series.length) return '<div class="empty-state small">No data points yet.</div>';
  const vals = series.map(function (s) { return s.value; });
  const maxV = Math.max.apply(null, vals.concat([opt.std || 0, 1]));
  const minV = 0;
  const n = series.length;
  const xAt = function (i) { return n === 1 ? w / 2 : (i / (n - 1)) * w; };
  const yAt = function (v) { return padT + (h - padT - padB) * (1 - (v - minV) / (maxV - minV)); };
  let d = "";
  series.forEach(function (s, i) { d += (i ? "L" : "M") + xAt(i).toFixed(1) + " " + yAt(s.value).toFixed(1); });
  let out = '<svg viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none" role="img" aria-label="line chart">';
  out += '<line class="grid-line" x1="0" y1="' + yAt(0) + '" x2="' + w + '" y2="' + yAt(0) + '"/>';
  if (opt.std) out += '<line x1="0" y1="' + yAt(opt.std).toFixed(1) + '" x2="' + w + '" y2="' + yAt(opt.std).toFixed(1) + '" stroke="#9E3A2D" stroke-dasharray="4 3" stroke-width="1"/>';
  out += '<path class="ln" d="' + d + '"/>';
  series.forEach(function (s, i) {
    out += '<circle class="pt" cx="' + xAt(i).toFixed(1) + '" cy="' + yAt(s.value).toFixed(1) + '" r="2.4"><title>' + esc(s.label) + ": " + num(s.value, 2) + "</title></circle>";
  });
  out += "</svg></div>";
  return '<div class="chart">' + out;
}

      '<nav class="rail-nav"><div class="rail-group">Control</div>' + railItems +
        '<div class="rail-group">Support</div><div class="rail-item" data-act="help">' + ic("help") + "<span>Operating guide</span></div></nav>" +
      '<div class="rail-foot"><div class="rail-scale"><span>Text</span>' +
        [0.9, 1, 1.1, 1.2].map(function (v) {
          const cur = Number(localStorage.getItem(LS_SCALE)) || (DB.settings && DB.settings.uiScale) || 1;
          return '<button class="scale-btn' + (Math.abs(cur - v) < 0.02 ? " on" : "") + '" data-act="set-scale" data-v="' + v + '" title="Text size ' + Math.round(v * 100) + '%">' + Math.round(v * 100) + "</button>";
        }).join("") + "</div>" +
        '<div class="rail-user"><div class="avatar">' + esc(initials(u.name)) + "</div><div style=\"min-width:0\">" +
        '<div class="rail-user-name">' + esc(u.name) + '</div><div class="rail-user-role">' + esc(r.label) + "</div></div></div>" +
        '<button class="btn btn-sm" data-act="logout">' + ic("logout") + " Sign out</button></div>" +
    "</aside>" +
    '<div class="main">' +
      '<div class="topbar">' +
        '<button class="rail-toggle" data-act="toggle-rail" aria-label="Menu">' + ic("menu") + "</button>" +
        '<div class="search-box">' + ic("search") + '<input id="globalSearch" placeholder="Search machine code, type, site or serial" autocomplete="off"></div>' +
        '<span class="topbar-spacer"></span>' +
        '<span class="topbar-org"><span class="dot"></span>' + esc(org) + "</span>" +
        cloudBadgeHTML() +

        '<button class="btn btn-sm btn-primary" data-act="quick-service">' + ic("plus") + " Work order</button>" : "") +
      "</div>" +
      '<div class="view" id="view"></div>' +

}

</script>
<script>
/* ============================ 15. VIEW: DASHBOARD ============================ */
function viewDashboard() {
  const s = fleetStats();
  const months = lastMonths(12);
  const series = months.map(function (k) {
    const rows = DB.fuel.filter(function (f) { return monthKey(f.date) === k; });
    return { label: monthLabel(k), value: Math.round(sum(rows, function (f) { return f.cost; })) };
  });
  const topFuel = DB.machines.filter(function (m) { return m.status !== "Retired"; }).map(function (m) {
    return { m: m, f: fuelStats(m, 90) };
  }).sort(function (a, b) { return b.f.liters - a.f.liters; }).slice(0, 8);
  const worst = DB.machines.filter(function (m) { return m.status !== "Retired"; }).map(function (m) {
    return { m: m, st: worstPm(m) };
  }).filter(function (x) { return x.st.state === "overdue" || x.st.state === "soon"; })
    .sort(function (a, b) { return a.st.left - b.st.left; }).slice(0, 7);
  const reorder = DB.parts.filter(function (p) { return p.stock <= p.min; }).sort(function (a, b) { return a.stock - b.stock; }).slice(0, 8);
  const suspects = DB.machines.filter(function (m) { return m.status !== "Retired"; }).map(function (m) {
    return { m: m, f: fuelStats(m, 90) };
  }).filter(function (x) {
    return x.f.count >= 2 && x.f.dist > 5 && x.f.cons > 0 && x.f.std > 0 && Math.abs(x.f.variance) > 15;
  }).sort(function (a, b) { return Math.abs(b.f.variance) - Math.abs(a.f.variance); }).slice(0, 8);
  const events = [];
  DB.fuel.slice(-40).forEach(function (f) { events.push({ d: f.date, k: "fuel", t: "<b>" + esc((machineById(f.machineId) || {}).code || "") + "</b> refuelled " + num(f.liters, 1) + " L · " + money(f.cost) }); });
  DB.services.slice(-30).forEach(function (sv) { events.push({ d: sv.date, k: "svc", t: "<b>" + esc(sv.wo) + "</b> " + esc(sv.type) + " on " + esc((machineById(sv.machineId) || {}).code || "") }); });
  events.sort(function (a, b) { return a.d < b.d ? 1 : -1; });
  const recent = events.slice(0, 9);

  const statusRow = function (label, n, cls) {
    const w = s.total ? Math.round((n / s.total) * 100) : 0;
    return '<div style="display:grid;grid-template-columns:88px minmax(0,1fr) 34px;gap:8px;align-items:center;padding:5px 0">' +
      '<span class="small">' + label + '</span><span style="height:6px;background:' + cls + ';width:' + w + '%;min-width:2px;display:block;border-radius:1px"></span>' +
      '<span class="mono small" style="text-align:right">' + n + "</span></div>";
  };

  return pageHead("Fleet overview", "Live position across " + num(s.total) + " assets at " + DB.settings.sites.length + " locations. Figures in " + esc(DB.settings.currency) + ", last refreshed " + esc(nowISO()) + ".",
      '<button class="btn" data-act="export-dashboard">' + ic("download") + ' Export summary</button>' +
      '<button class="btn btn-primary" data-act="fleet-report">' + ic("print") + " Full fleet report</button>") +
    '<div class="kpi-strip">' +
      '<div class="kpi"><div class="kpi-label">Assets on register</div><div class="kpi-value">' + num(s.total) + '</div><div class="kpi-note">' + num(s.active) + " active · " + num(s.idle) + " idle</div></div>" +
      '<div class="kpi"><div class="kpi-label">Availability</div><div class="kpi-value ' + (s.avail >= 85 ? "ok" : (s.avail >= 70 ? "warn" : "bad")) + '">' + s.avail + '%</div><div class="kpi-note">' + num(s.maint) + " under maintenance</div></div>" +
      '<div class="kpi"><div class="kpi-label">Breakdown</div><div class="kpi-value ' + (s.down ? "bad" : "ok") + '">' + num(s.down) + '</div><div class="kpi-note">machines stopped</div></div>' +
      '<div class="kpi"><div class="kpi-label">Open work orders</div><div class="kpi-value">' + num(s.openWo) + '</div><div class="kpi-note">' + num(DB.services.length) + " on file</div></div>" +
      '<div class="kpi"><div class="kpi-label">PM overdue</div><div class="kpi-value ' + (s.overdue ? "bad" : "ok") + '">' + num(s.overdue) + '</div><div class="kpi-note">' + num(s.soon) + " due soon</div></div>" +
      '<div class="kpi"><div class="kpi-label">Fuel cost, 30 days</div><div class="kpi-value">' + num(s.cost30) + '</div><div class="kpi-note">' + num(s.litres30) + " litres issued</div></div>" +
    "</div>" +
    '<div class="dash-grid"><div class="dash-col">' +
      '<div class="panel"><div class="panel-head"><div class="panel-title">Fuel spend by month <span class="sub">last 12 months, ' + esc(DB.settings.currency) + "</span></div>" +
        '<span style="flex:1"></span><button class="btn btn-sm" data-act="fleet-fuel-report">' + ic("print") + " Report</button></div>" +
        '<div class="panel-body">' + svgBar(series, { color: "#2C363E", height: 180, label: "Fuel cost by month" }) +
        '<div class="legend"><span><i style="background:#2C363E"></i>Fuel cost</span><span class="muted">Peak ' + money(Math.max.apply(null, series.map(function (x) { return x.value; }).concat([0]))) + "</span></div></div></div>" +
      '<div class="panel"><div class="panel-head"><div class="panel-title">Top fuel consumers <span class="sub">90 days</span></div><span style="flex:1"></span>' +
        '<button class="btn btn-sm" data-act="export-fuel">' + ic("download") + " CSV</button></div>" +
        '<div class="table-wrap"><table class="tbl"><colgroup><col style="width:18%"><col style="width:36%"><col style="width:16%"><col style="width:30%"></colgroup>' +
        '<thead><tr><th>Code</th><th>Machine</th><th class="num">Litres</th><th class="num">Cost</th></tr></thead><tbody>' +
        topFuel.map(function (x) {
          return '<tr class="row-link" data-machine="' + x.m.id + '"><td class="cell-code">' + esc(x.m.code) + '</td><td><div class="cell-main">' + esc(x.m.type) + '</div><div class="cell-sub">' + esc(x.m.site) + '</div></td>' +
            '<td class="num">' + num(x.f.liters) + '</td><td class="num">' + money(x.f.cost) + "</td></tr>";
        }).join("") + "</tbody></table></div></div>" +
      '<div class="panel"><div class="panel-head"><div class="panel-title">Fuel variance watchlist <span class="sub">burn rate checked against the odometer or hour meter, 90 days</span></div>' +
        '<span style="flex:1"></span><span class="tag ' + (suspects.length ? "bad" : "ok") + '">' + suspects.length + " flagged</span></div>" +
        (suspects.length ? '<div class="table-wrap"><table class="tbl"><colgroup><col style="width:12%"><col style="width:30%"><col style="width:16%"><col style="width:14%"><col style="width:16%"><col style="width:12%"></colgroup>' +
          '<thead><tr><th>Code</th><th>Machine</th><th class="num">Actual</th><th class="num">Standard</th><th class="num">Variance</th><th>Basis</th></tr></thead><tbody>' +
          suspects.map(function (x) {
            const over = x.f.variance > 0;
            return '<tr class="row-link" data-machine="' + x.m.id + '"><td class="cell-code">' + esc(x.m.code) + '</td>' +
              '<td><div class="cell-main trunc">' + esc(x.m.type) + '</div><div class="cell-sub">' + esc(x.m.site) + "</div></td>" +
              '<td class="num">' + num(x.f.cons, 2) + '</td><td class="num">' + num(x.m.expCons, 1) + '</td>' +
              '<td class="num"><span class="tag ' + (over ? "bad" : "warn") + '">' + (over ? "+" : "") + num(x.f.variance, 1) + "%</span></td>" +
              '<td class="small">' + fuelRateText(x.m) + "</td></tr>";
          }).join("") + "</tbody></table></div>" +
          '<div class="panel-body" style="border-top:1px solid var(--line-2)"><div class="tiny muted">Actual rate = litres issued divided by distance or hours run between readings. ' +
          "A positive variance means more fuel than the standard; check the odometer, the tank and the pump invoices before drawing a conclusion.</div></div>" +
          (canView("fuel") ? '<div class="panel-foot"><a data-nav="fuel" style="color:var(--amber-2);font-weight:600;cursor:pointer">Open fuel log</a></div>' : "")
        : '<div class="empty-state"><div class="es-title">No fuel variance beyond 15%</div>Every machine burns within its standard over the last 90 days.</div>') + "</div>" +
      '<div class="panel"><div class="panel-head"><div class="panel-title">Recent activity</div><span style="flex:1"></span><span class="tiny muted">fuel, work orders</span></div>' +
        '<div class="panel-body"><div class="timeline">' + recent.map(function (e) {
          return '<div class="tl-item"><span class="tl-dot ' + e.k + '"></span><div class="tl-when">' + esc(e.d) + '</div><div class="tl-what">' + e.t + "</div></div>";
        }).join("") + "</div></div></div>" +
    "</div><div class=\"dash-col\">" +
      '<div class="panel"><div class="panel-head"><div class="panel-title">Status position</div></div><div class="panel-body">' +
        statusRow("Active", s.active, "#2E7A46") + statusRow("Idle", s.idle, "#8894A0") + statusRow("Under maint.", s.maint, "#C0821A") +
        statusRow("Breakdown", s.down, "#9E3A2D") + statusRow("Retired", s.total - s.active - s.idle - s.maint - s.down, "#3A464E") + "</div></div>" +
      '<div class="panel"><div class="panel-head"><div class="panel-title">PM attention <span class="sub">meter or calendar</span></div><span style="flex:1"></span>' +
        '<button class="btn btn-sm" data-act="export-pm">' + ic("download") + " CSV</button></div>" +
        (worst.length ? '<div class="table-wrap"><table class="tbl"><colgroup><col style="width:22%"><col style="width:44%"><col style="width:34%"></colgroup><tbody>' +
          worst.map(function (x) {
            return '<tr class="row-link" data-machine="' + x.m.id + '"><td class="cell-code">' + esc(x.m.code) + '</td><td><div class="cell-main trunc">' + esc(x.m.type) + '</div><div class="cell-sub">' + esc(x.m.site) + '</div></td>' +
              '<td><span class="tag ' + (x.st.state === "overdue" ? "bad" : "warn") + '">' + esc(x.st.label) + "</span></td></tr>";
          }).join("") + "</tbody></table></div>" : '<div class="empty-state"><div class="es-title">Every task in tolerance</div>No PM overdue or due soon.</div>') +
        (canView("pm") ? '<div class="panel-foot"><a data-nav="pm" style="color:var(--amber-2);font-weight:600;cursor:pointer">Open PM board</a></div>' : "") + "</div>" +
      '<div class="panel"><div class="panel-head"><div class="panel-title">Reorder list <span class="sub">at or below reorder point</span></div></div>' +
        (reorder.length ? '<div class="table-wrap"><table class="tbl"><colgroup><col style="width:34%"><col style="width:38%"><col style="width:28%"></colgroup><thead><tr><th>Part no.</th><th>Description</th><th class="num">Stock</th></tr></thead><tbody>' +
          reorder.map(function (p) {
            return '<tr><td class="cell-code">' + esc(p.partNo) + '</td><td class="small trunc">' + esc(p.name) + '</td><td class="num">' + p.stock + " / " + p.min + "</td></tr>";
          }).join("") + "</tbody></table></div>" : '<div class="empty-state"><div class="es-title">Stock is healthy</div>Nothing below the reorder point.</div>') +
        (canView("parts") ? '<div class="panel-foot"><a data-nav="parts" style="color:var(--amber-2);font-weight:600;cursor:pointer">Open spare parts</a></div>' : "") + "</div>" +
    "</div></div>";
}

/* ============================ 16. VIEW: MACHINE REGISTER ============================ */
function viewMachines() {
  const f = UI.filters;
  let list = DB.machines.slice();
  if (f.q) {
    const q = f.q.toLowerCase();
    list = list.filter(function (m) {
      return (m.code + " " + m.type + " " + m.make + " " + m.model + " " + m.serial + " " + m.site + " " + m.operator + " " + (m.custodian || "") + " " + (m.locationDetail || "")).toLowerCase().indexOf(q) >= 0;
    });
  }
  if (f.type) list = list.filter(function (m) { return m.type === f.type; });
  if (f.status) list = list.filter(function (m) { return m.status === f.status; });
  if (f.condition) list = list.filter(function (m) { return m.condition === f.condition; });
  if (f.site) list = list.filter(function (m) { return m.site === f.site; });
  if (f.sort === "cost") {
    const cached = list.map(function (m) { return { m: m, c: costStats(m, 90).total }; });
    cached.sort(function (a, b) { return b.c - a.c; });
    list = cached.map(function (x) { return x.m; });
  } else {
    list = by(list, f.sort || "code", f.dir || "asc");
  }
  const total = list.length;
  const size = UI.pageSize;
  const pages = Math.max(1, Math.ceil(total / size));
  const page = clamp(UI.page || 1, 1, pages);
  const rows = list.slice((page - 1) * size, page * size);

  const opt = function (v, cur) { return "<option" + (String(cur || "") === String(v) ? " selected" : "") + ">" + esc(v) + "</option>"; };
  const typeOpts = machineTypeNames().map(function (t) { return opt(t, f.type); }).join("");
  const statusOpts = STATUSES.map(function (t) { return opt(t, f.status); }).join("");
  const siteOpts = DB.settings.sites.map(function (t) { return opt(t, f.site); }).join("");
  const condOpts = ASSET_CONDITIONS.map(function (t) { return opt(t, f.condition); }).join("");

  return pageHead("Machine register", num(DB.machines.length) + " assets. Every fuel, part and service record is attached to one of these codes.",
      '<button class="btn" data-act="meter-logs">' + ic("book") + ' Daily logs</button>' +
      (can("dataWrite") ? '<button class="btn" data-act="meter-log">' + ic("gauge") + ' Log daily</button>' : "") +
      '<button class="btn" data-act="export-machines">' + ic("download") + ' Export CSV</button>' +
      (can("masterWrite") ? '<button class="btn" data-act="import-machines-excel">' + ic("upload") + ' Excel import</button>' : "") +
      '<button class="btn" data-act="excel-template" data-kind="machines">Template</button>' +
      (can("masterWrite") ? '<button class="btn btn-primary" data-act="add-machine">' + ic("plus") + " Add machine</button>" : "")) +
    '<div class="filter-bar" style="border-bottom:1px solid var(--line)">' +
      '<input class="inp" id="machQ" data-f="q" placeholder="Search code, type, serial, operator" value="' + esc(f.q || "") + '" style="min-width:250px">' +
      '<select class="sel" data-f="type"><option value="">All types</option>' + typeOpts + "</select>" +
      '<select class="sel" data-f="status"><option value="">All statuses</option>' + statusOpts + "</select>" +
      '<select class="sel" data-f="site"><option value="">All sites</option>' + siteOpts + "</select>" +
      '<select class="sel" data-f="condition"><option value="">All conditions</option>' + condOpts + "</select>" +
      '<select class="sel" data-f="sort">' + ["code", "type", "status", "meter", "cost"].map(function (k) {
        return '<option value="' + k + '"' + (f.sort === k ? " selected" : "") + ">Sort: " + k + "</option>";
      }).join("") + "</select>" +
      '<span style="flex:1"></span><span class="small muted">' + num(total) + " matching</span></div>" +
    '<div class="panel" style="border-top:0;border-radius:0 0 var(--r) var(--r)">' +
      '<div class="table-wrap"><table class="tbl"><colgroup><col style="width:8%"><col style="width:18%"><col style="width:8%"><col style="width:12%"><col style="width:12%"><col style="width:11%"><col style="width:5%"><col style="width:10%"><col style="width:4%"><col style="width:12%"></colgroup>' +
      '<thead><tr><th>Code</th><th>Machine</th><th>Type</th><th>Site</th><th>Status</th><th class="num">Latest meter</th><th class="num">Std</th><th>PM status</th><th class="num">WO</th><th class="num">Action</th></tr></thead><tbody>' +
      (rows.length ? rows.map(function (m) {
        const st = worstPm(m);
        return '<tr class="row-link" data-machine="' + m.id + '">' +
          '<td class="cell-code">' + esc(m.code) + "</td>" +
          '<td><div class="cell-main trunc">' + esc(m.type) + " " + esc(m.model) + '</div><div class="cell-sub trunc">' + esc(m.make) + " · " + esc(m.serial) + "</div></td>" +
          '<td class="small trunc">' + esc(m.category) + "</td>" +
          '<td class="small trunc"><div>' + esc(m.site) + '</div><div class="cell-sub trunc">' + esc(m.locationDetail || "—") + "</div></td>" +

function mtPm(m) {

    '<div class="panel-foot">Next due recalculates from the latest daily log or machine meter reading plus the task interval. Calendar tasks use the completion date. Each completion is stored in the Service record tab with technician, parts, reading, reference and cost.</div></div>';

function mtDocs(m) {

<script>
/* ============================ 18. VIEW: FUEL LOG ============================ */
function viewFuel() {
  const f = UI.filters;
  const days = Number(f.days || 90);
  const from = daysAgo(days);
  const rows = DB.fuel.filter(function (x) { return x.date >= from; }).slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  const months = lastMonths(days > 180 ? 12 : 6);
  const series = months.map(function (k) {
    const r = DB.fuel.filter(function (x) { return monthKey(x.date) === k; });
    return { label: monthLabel(k), value: Math.round(sum(r, function (x) { return x.cost; })) };
  });
  const litres = sum(rows, function (x) { return x.liters; });
  const cost = sum(rows, function (x) { return x.cost; });
  const outliers = DB.machines.filter(function (m) { return m.status !== "Retired"; }).map(function (m) {
    return { m: m, f: fuelStats(m, days) };
  }).filter(function (x) { return x.f.cons && Math.abs(x.f.variance) > 15 && x.f.dist > 5; })
    .sort(function (a, b) { return Math.abs(b.f.variance) - Math.abs(a.f.variance); });
  const opt = function (v, cur) { return "<option" + (String(cur) === String(v) ? " selected" : "") + ' value="' + v + '">' + v + " days</option>"; };

  return pageHead("Fuel log", "Every litre issued, by machine and meter reading. Consumption is the litres between refuels divided by the meter movement.",
      '<button class="btn" data-act="export-fuel">' + ic("download") + ' Export CSV</button>' +
      '<button class="btn btn-primary" data-act="fleet-fuel-report">' + ic("print") + " Fuel report</button>") +
    '<div class="kpi-strip" style="grid-template-columns:repeat(4,minmax(0,1fr))">' +
      '<div class="kpi"><div class="kpi-label">Litres, ' + days + " days</div><div class=\"kpi-value\">" + num(litres) + '</div><div class="kpi-note">' + num(rows.length) + " entries</div></div>" +
      '<div class="kpi"><div class="kpi-label">Fuel cost</div><div class="kpi-value">' + num(cost) + '</div><div class="kpi-note">' + money(cost / Math.max(1, days) * 30) + " per month</div></div>" +
      '<div class="kpi"><div class="kpi-label">Average price</div><div class="kpi-value">' + (litres ? num(cost / litres, 1) : "—") + '</div><div class="kpi-note">per litre</div></div>' +
      '<div class="kpi"><div class="kpi-label">Outliers</div><div class="kpi-value ' + (outliers.length ? "bad" : "ok") + '">' + outliers.length + '</div><div class="kpi-note">beyond ±15% of standard</div></div></div>' +
    '<div class="dash-grid"><div class="dash-col">' +
      '<div class="panel"><div class="panel-head"><div class="panel-title">Fuel spend by month</div><span style="flex:1"></span>' +
        '<select class="sel" data-f="days">' + opt(30, days) + opt(90, days) + opt(365, days) + "</select></div>" +
        '<div class="panel-body">' + svgBar(series, { height: 170, label: "Fuel spend" }) + "</div></div>" +
      '<div class="panel"><div class="panel-head"><div class="panel-title">Issue register <span class="sub">' + expenses(rows.length, days) + "</span></div></div>" +
        '<div class="table-wrap"><table class="tbl"><colgroup><col style="width:11%"><col style="width:11%"><col style="width:20%"><col style="width:10%"><col style="width:11%"><col style="width:11%"><col style="width:14%"><col style="width:12%"></colgroup>' +
        '<thead><tr><th>Date</th><th>Machine</th><th>Type / model</th><th class="num">Litres</th><th class="num">Cost</th><th class="num">Meter</th><th>Station</th><th>Invoice</th></tr></thead><tbody>' +
        (rows.length ? rows.slice(0, 60).map(function (x) {
          const m = machineById(x.machineId) || {};
          return '<tr class="row-link" data-machine="' + x.machineId + '"><td class="small">' + esc(x.date) + '</td><td class="cell-code">' + esc(m.code || "—") + "</td>" +
            '<td class="small trunc">' + esc(m.type || "") + " " + esc(m.model || "") + '</td><td class="num">' + num(x.liters, 1) + '</td><td class="num">' + num(x.cost) + '</td>' +
            '<td class="num">' + num(x.meter) + '</td><td class="small trunc">' + esc(x.station) + '</td><td class="small mono">' + esc(x.invoice) + "</td></tr>";
        }).join("") : '<tr><td colspan="8" class="tbl-empty">No fuel entries in this period.</td></tr>') +
        "</tbody></table></div>" + (rows.length > 60 ? '<div class="panel-foot">Showing the newest 60 of ' + num(rows.length) + " entries. Export CSV for the full ledger.</div>" : "") + "</div>" +
    "</div><div class=\"dash-col\">" +
      '<div class="panel"><div class="panel-head"><div class="panel-title">Consumption alarms <span class="sub">investigate first</span></div></div>' +
        (outliers.length ? '<div class="table-wrap"><table class="tbl"><colgroup><col style="width:19%"><col style="width:37%"><col style="width:22%"><col style="width:22%"></colgroup><tbody>' +
          outliers.slice(0, 12).map(function (x) {
            return '<tr class="row-link" data-machine="' + x.m.id + '"><td class="cell-code">' + esc(x.m.code) + '</td><td><div class="cell-main trunc">' + esc(x.m.type) + '</div><div class="cell-sub">' + esc(x.m.site) + "</div></td>" +
              '<td class="num small">' + num(x.f.cons, 2) + " / " + num(x.m.expCons, 1) + '</td><td class="num"><span class="tag ' + (x.f.variance > 0 ? "bad" : "warn") + '">' + (x.f.variance > 0 ? "+" : "") + num(x.f.variance, 1) + "%</span></td></tr>";
          }).join("") + "</tbody></table></div>" : '<div class="empty-state"><div class="es-title">All machines in tolerance</div>No consumption beyond ±15% in this period.</div>') +
        '<div class="panel-foot">Check: leak, injector, air intake, tyre pressure, idling, or pump measurement error.</div></div>' +
      '<div class="panel"><div class="panel-head"><div class="panel-title">Method</div></div><div class="panel-body small muted">' +
        "<p style=\"margin:0 0 8px\">Record the meter reading at every refuel. The system takes the litres between two consecutive refuels and divides by the meter movement, which gives L/h for hour-metered plant and L/km for vehicles.</p>" +
        "<p style=\"margin:0 0 8px\">Compare that rate with the standard consumption on the asset record. A positive variance means the machine is using more fuel than it should.</p>" +
        "<p style=\"margin:0\">Enter the invoice number so the store and accounts can reconcile the same litre twice.</p></div></div>" +
    "</div></div>";
}
function expenses(n, days) { return n + " entries in " + days + " days"; }

/* ============================ 19. VIEW: SPARE PARTS ============================ */
function locChipsHTML(p, focus) {
  const rows = partLocRows(p);
  if (!rows.length) return '<span class="loc none">no stock held</span>';
  const sorted = focus ? rows.filter(function (l) { return l.site === focus; }).concat(rows.filter(function (l) { return l.site !== focus; })) : rows;
  const shown = sorted.slice(0, 3).map(function (l) {
    return '<span class="loc' + (focus && l.site === focus ? " on" : "") + '" title="' + esc(l.site + " · " + l.bin) + '">' +
      '<span class="loc-site">' + esc(l.site) + '</span><span class="loc-bin">' + esc(l.bin) + '</span><span class="loc-q"><b>' + num(l.qty) + "</b> " + esc(p.unit) + "</span></span>";
  }).join("");
  return shown + (sorted.length > 3 ? '<span class="loc more">+' + (sorted.length - 3) + " site" + (sorted.length - 3 > 1 ? "s" : "") + "</span>" : "");
}
function viewParts() {
  const f = UI.filters;

    const q = f.q.toLowerCase();
    list = list.filter(function (p) {
      return (p.partNo + " " + p.name + " " + p.category + " " + partLocRows(p).map(function (l) { return l.site + " " + l.bin; }).join(" ")).toLowerCase().indexOf(q) >= 0;
    });
  }
  if (f.cat) list = list.filter(function (p) { return p.category === f.cat; });
  if (site) list = list.filter(function (p) { return partLocRows(p).some(function (l) { return l.site === site && l.qty > 0; }); });
  if (f.low) list = list.filter(function (p) { return p.stock <= p.min; });
  list = by(list, f.sort || "partNo");
  const value = sum(DB.parts, function (p) { return p.stock * p.unitCost; });
  const low = DB.parts.filter(function (p) { return p.stock <= p.min; }).length;
  const out = DB.parts.filter(function (p) { return p.stock <= 0; }).length;
  const issued = sum(DB.moves.filter(function (mv) { return mv.type === "OUT" && mv.date >= daysAgo(30); }), function (mv) { return mv.qty; });
  const recent = DB.moves.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).slice(0, 12);
  const catOpts = PART_CATEGORIES.map(function (c) { return "<option" + (f.cat === c ? " selected" : "") + ">" + esc(c) + "</option>"; }).join("");
  const siteOpts = (DB.settings.sites || []).map(function (s) { return "<option" + (site === s ? " selected" : "") + ">" + esc(s) + "</option>"; }).join("");
  const siteCount = DB.settings.sites.filter(function (s) {
    return DB.parts.some(function (p) { return partLocRows(p).some(function (l) { return l.site === s && l.qty > 0; }); });
  }).length;

  return pageHead("Spare parts store", num(DB.parts.length) + " part numbers held in " + siteCount + " site stores. Open any part number to see which site store, rack and bin hold it and every stock movement; vendor and purchase details are recorded only on the stock receipt.",
      '<button class="btn" data-act="export-parts">' + ic("download") + ' Export CSV</button>' +
