      '<button class="btn" data-act="excel-template" data-kind="parts">Template</button>' +
      (can("masterWrite") ? '<button class="btn" data-act="add-part">' + ic("plus") + " Add part</button>" : "") +
      (can("dataWrite") ? '<button class="btn btn-primary" data-act="receive-stock">' + ic("upload") + " Receive stock</button>" : "")) +
    '<div class="g-4" style="margin-bottom:14px">' +
      miniStat("Stock value", money(value), "at standard unit cost") +
      miniStat("Below reorder", String(low), "of " + DB.parts.length + " lines", low ? "warn" : "ok") +

      miniStat("Issued, 30 days", num(issued), "units across all machines") + "</div>" +
    '<div class="panel"><div class="filter-bar" style="border:0;border-bottom:1px solid var(--line-2)">' +
      '<input class="inp" data-f="q" placeholder="Part number or description" value="' + esc(f.q || "") + '" style="min-width:230px">' +

      '<label class="small" style="display:flex;align-items:center;gap:5px;cursor:pointer"><input type="checkbox" data-f="low"' + (f.low ? " checked" : "") + "> Reorder only</label>" +
      '<span style="flex:1"></span><span class="small muted">' + num(list.length) + " lines</span></div>" +
      '<div class="table-wrap hide-sm"><table class="tbl"><colgroup><col style="width:12%"><col style="width:38%"><col style="width:10%"><col style="width:7%"><col style="width:7%"><col style="width:12%"><col style="width:14%"></colgroup>' +
      '<thead><tr><th>Part no.</th><th>Description</th><th>Category</th><th class="num">On hand</th><th class="num">Reorder</th><th class="num">Value</th><th class="num">Actions</th></tr></thead><tbody>' +
      (list.length ? list.map(function (p) {
        const st = stockState(p);

          '<td><div class="cell-main trunc">' + esc(p.name) + "</div></td>" +
          '<td class="small trunc">' + esc(p.category) + "</td>" +
          '<td class="num"><span class="' + (st.state === "ok" ? "" : "tag " + (st.state === "out" ? "bad" : "warn")) + '" title="' + (site ? "Held at " + esc(site) + " · total " + num(p.stock) : "Held across all sites") + '">' + num(here) + "</span></td>" +
          '<td class="num small">' + num(p.min) + '</td><td class="num">' + num(p.stock * p.unitCost) + "</td>" +
          '<td class="actcell">' + (can("dataWrite") ? '<button class="btn btn-sm" data-act="issue-part" data-id="' + p.id + '">Issue</button>' : "") +

      '<div class="part-cards">' + (list.length ? list.map(function (p) {
        const st = stockState(p);
        return '<div class="pcard"><div class="pcard-top"><a class="cell-code link" data-act="part-detail" data-id="' + p.id + '">' + esc(p.partNo) + "</a>" +
          '<span class="pcard-qty ' + (st.state === "ok" ? "" : (st.state === "out" ? "bad" : "warn")) + '">' + num(p.stock) + " " + esc(p.unit) + "</span></div>" +
          '<div class="pcard-name">' + esc(p.name) + "</div>" +
          '<div class="pcard-foot"><span class="tiny muted">' + esc(p.category) + " · " + money(p.stock * p.unitCost) + '</span><span style="flex:1"></span>' +
          (can("dataWrite") ? '<button class="btn btn-sm" data-act="issue-part" data-id="' + p.id + '">Issue</button>' : "") +

function viewPm() {
  const f = UI.filters;
  let rows = DB.pm.filter(function (p) { return p.active; }).map(function (p) {
    return { p: p, m: machineById(p.machineId) || {}, st: pmState(p) };
  });
  if (f.state) rows = rows.filter(function (r) { return r.st.state === f.state; });
  const sortMode = f.sort || "due";
  function cmpMachine(a, b) {
    return String(a.m.code || "").localeCompare(String(b.m.code || ""), undefined, { numeric: true, sensitivity: "base" });
  }
  if (sortMode === "machine") rows.sort(function (a, b) { return cmpMachine(a, b) || (a.st.left - b.st.left); });
  else if (sortMode === "machine-desc") rows.sort(function (a, b) { return cmpMachine(b, a) || (a.st.left - b.st.left); });
  else rows.sort(function (a, b) { return a.st.left - b.st.left; });
  const overdue = rows.filter(function (r) { return r.st.state === "overdue"; }).length;
  const soon = rows.filter(function (r) { return r.st.state === "soon"; }).length;
  const ok = rows.filter(function (r) { return r.st.state === "ok"; }).length;
  const compliance = rows.length ? Math.round(((soon + ok) / rows.length) * 100) : 100;

  return pageHead("PM board", "Tasks sorted by the nearest due point, or grouped by machine code when you choose that sort. Mark a task done and the next due point recalculates.",

      '<option value="soon"' + (f.state === "soon" ? " selected" : "") + ">Due soon</option><option value=\"ok\"" + (f.state === "ok" ? " selected" : "") + ">In tolerance</option></select>" +

<script>
/* ============================ 25. RENDER AND ROUTER ============================ */
function viewHTML() {
  switch (UI.view) {
    case "machines": return viewMachines();
    case "machine": return viewMachineDetail();
    case "fuel": return viewFuel();
    case "parts": return viewParts();
    case "services": return viewServices();
    case "pm": return viewPm();
    case "sops": return viewSops();
    case "reports": return viewReports();
    case "admin": return viewAdmin();
    default: return viewDashboard();
  }
}
function render() {
  const app = document.getElementById("app");
  if (!app) return;
  if (!DB.users.length) { app.innerHTML = setupScreen(); return; }
  const u = currentUser();
  if (!u) { app.innerHTML = loginScreen(); return; }
  if (!viewAllowed(UI.view)) UI.view = firstAllowedView();
  app.innerHTML = shellHTML(u);
  const v = document.getElementById("view");
  if (v) v.innerHTML = viewHTML();
  if (UI.view === "reports") bindReportSearch();
}
function rerenderView() {
  const v = document.getElementById("view");
  if (v) v.innerHTML = viewHTML();
}
function navigate(view, params) {
  if (!viewAllowed(view)) { toast("Your role does not have access to that section.", "err"); return; }
  UI.view = view;
  UI.params = params || {};
  UI.page = 1;
  UI.filters = {};
  UI.tab = "overview";
  if (view === "admin") UI.adminTab = UI.adminTab || "users";
  render();
  window.scrollTo(0, 0);
}
function closeRail() {
  const r = document.getElementById("rail");
  if (r) r.classList.remove("open");
  const s = document.getElementById("railScrim");
  if (s) s.remove();
}

/* ============================ 26. MODAL AND FORM HELPERS ============================ */
function openModal(cfg) {
  closeModal();
  const back = document.createElement("div");
  back.className = "modal-back";
  back.id = "modalBack";
  back.innerHTML = '<div class="modal ' + (cfg.wide ? "wide" : "") + '">' +
    '<div class="modal-head"><div class="modal-title">' + cfg.title + '</div><button class="x-btn" data-close="1" aria-label="Close">' + ic("close") + "</button></div>" +
    '<div class="modal-body"><div id="modalErr"></div>' + cfg.body + "</div>" +
    '<div class="modal-foot">' + (cfg.hideSave ? '<button class="btn" data-close="1">Close</button>' : '<button class="btn" data-close="1">Cancel</button><button class="btn btn-primary" id="modalSave">' + (cfg.saveLabel || "Save") + "</button>") + "</div></div>";
  document.body.appendChild(back);
  document.body.style.overflow = "hidden";
  back.addEventListener("mousedown", function (e) { if (e.target === back) closeModal(); });
  const closeBtns = back.querySelectorAll("[data-close]");
  Array.prototype.forEach.call(closeBtns, function (b) { b.addEventListener("click", closeModal); });
  const save = document.getElementById("modalSave");
  if (save && cfg.onSave) {
    save.addEventListener("click", function () {
      let err;
      try {
        err = cfg.onSave();
      } catch (ex) {
        console.error(ex);
        err = (ex && ex.message) ? ex.message : "The record could not be saved.";
      }
      if (typeof err === "string") {
        const eb = document.getElementById("modalErr");
        if (eb) eb.innerHTML = '<div class="form-error">' + esc(err) + "</div>";
        return;
      }
      closeModal();
      saveDB();
      if (cfg.after) cfg.after();
      render();
    });
  }
  const first = back.querySelector("input,select,textarea");
  if (first) first.focus();
}
function closeModal() {
  const back = document.getElementById("modalBack");
  if (back) back.remove();
  document.body.style.overflow = "";
}
function val(id) {
  const el = document.getElementById(id);
  return el ? String(el.value || "").trim() : "";
}
function fld(id, label, value, type, hint, extra) {
  return '<div class="field"><label for="' + id + '">' + esc(label) + "</label>" +
    '<input class="inp" id="' + id + '" type="' + (type || "text") + '" value="' + esc(value === undefined || value === null ? "" : value) + '"' + (extra || "") + ">" +
    (hint ? '<div class="hint">' + esc(hint) + "</div>" : "") + "</div>";
}
function fsel(id, label, options, value, full, hint) {
  const opts = options.map(function (o) {
    const v = Array.isArray(o) ? o[0] : o;
    const t = Array.isArray(o) ? o[1] : o;
    return '<option value="' + esc(v) + '"' + (String(value) === String(v) ? " selected" : "") + ">" + esc(t) + "</option>";
  }).join("");
  return '<div class="field' + (full ? " full" : "") + '"><label for="' + id + '">' + esc(label) + "</label>" +

      const m = machineById(mid);
      if (!m) return "Choose a machine.";
      const liters = Number(val("fLiters")), price = Number(val("fPrice")), meter = Number(val("fMeter"));
      if (!liters || liters <= 0) return "Enter the litres issued.";
      if (!meter || meter <= 0) return "Enter the odometer or hour meter reading at refuel.";
      const date = val("fDate") || todayISO();
      if (date < daysAgo(3650)) return "Date looks wrong.";
      const prior = fuelLogs(m.id).filter(function (f) { return f.date <= date; }).slice(-1)[0];
      if (prior && meter < prior.meter) return "Meter reading is below the previous fuel record of " + num(prior.meter) + ". Check the entry.";
      DB.fuel.push({
        id: uid("f"), machineId: mid, date: date, liters: liters, unitPrice: price || 0,
        cost: Math.round(liters * (price || 0)), meter: meter,
        station: val("fStation"), operator: val("fOperator"), invoice: val("fInvoice"), notes: val("fNotes"), site: m.site
      });
      m.updatedAt = nowISO();
      audit("CREATE", "fuel", mid, num(liters, 1) + " L to " + m.code + " at " + meter);
      toast("Fuel recorded for " + m.code, "ok");
    }
  });
  const fm = document.getElementById("fMachine");
  if (fm) {
    const syncFm = function () { setFieldText("fMeter", "Odometer / hour meter at refuel", "Used only for fuel consumption in reports. It does not change the machine dashboard meter; the dashboard follows the latest daily log."); };
    fm.addEventListener("change", syncFm); syncFm();
  }
  const l = document.getElementById("fLiters"), p = document.getElementById("fPrice");
  const recalc = function () {
    const c = document.getElementById("fCostNote");
    if (c) c.textContent = money((Number(l.value) || 0) * (Number(p.value) || 0));
  };
  [l, p].forEach(function (x) { if (x) x.addEventListener("input", recalc); });
}

function collectPartRows() {
  const rowsSum = { parts: [], error: "" };
  const rows = document.getElementById("partsRows");
  if (!rows) return rowsSum;
  const nodes = rows.querySelectorAll(".part-row");
  Array.prototype.forEach.call(nodes, function (n) {
    const partId = n.querySelector(".part-pick").value;
    const qty = Number(n.querySelector(".part-qty").value) || 0;
    const unitCost = Number(n.querySelector(".part-cost").value) || 0;
    if (!partId || qty <= 0) return;
    const p = partById(partId);
    if (!p) return;
    const site = val("sPartSite") || DB.settings.sites[0];
    const atSite = partLocRows(p).filter(function (l) { return l.site === site; });
    const available = sum(atSite, function (l) { return l.qty; });

function partModal(id) {
  if (!can("masterWrite")) { toast("Your role cannot change master data.", "err"); return; }
  const p = id ? partById(id) : null;
  const locNote = p ? '<div class="info-box" style="margin-bottom:12px"><b>Stock is held per site and bin.</b> On hand ' +

      (rows.length ? '<div class="table-wrap"><table class="tbl"><colgroup><col style="width:30%"><col style="width:32%"><col style="width:15%"><col style="width:23%"></colgroup>' +
        '<thead><tr><th>Site store</th><th>Rack / bin / container</th><th class="num">Quantity</th><th class="num">Value</th></tr></thead><tbody>' +
        rows.map(function (l, i) {
          return '<tr><td class="small">' + esc(l.site) + '</td><td class="mono small trunc">' + esc(l.bin) + "</td>" +
            '<td><input class="inp qty-inp" id="pQty' + i + '" data-site="' + esc(l.site) + '" data-bin="' + esc(l.bin) + '" value="' + l.qty + '" inputmode="decimal"></td>' +
            '<td class="num small q-val" id="pVal' + i + '">' + money(l.qty * p.unitCost) + "</td></tr>";
        }).join("") + "</tbody></table></div>"
        : '<div class="small muted" style="padding:4px 0 6px">No stock is held in any site yet. Add the first location below, or use Receive stock.</div>') +
      '<div class="stock-add">' +
        '<div class="field"><label for="pNewSite">Add to site store</label><select class="sel" id="pNewSite"><option value="">— none —</option>' +
          DB.settings.sites.map(function (x) { return '<option value="' + esc(x) + '">' + esc(x) + "</option>"; }).join("") + "</select></div>" +
        '<div class="field"><label for="pNewBin">Rack / bin / container</label><input class="inp" id="pNewBin" value="" placeholder="e.g. Rack 2-B / Bin 07"></div>' +
        '<div class="field"><label for="pNewQty">Quantity to add</label><input class="inp" id="pNewQty" value="" inputmode="decimal"></div>' +
      "</div>" +
      '<div class="stock-total">Total on hand <b id="pStockTotal">' + num(p.stock) + "</b> " + esc(p.unit) +
        ' · Stock value <b id="pStockValue">' + money(p.stock * p.unitCost) + "</b></div>" +

  })() : "";
  const body = locNote + '<div class="form-grid part-form">' +
    fld("pNo", "Part number", p ? p.partNo : "", "text", "Exactly as printed on the part or catalogue") +

    fld("pMax", "Maximum level", p ? p.max : 20, "number") +
    "</div>" + stockBlock + '<div class="form-grid" style="margin-top:12px">' + fta("pNotes", "Notes", p ? (p.notes || "") : "", 2, true) + "</div>";
  openModal({
    title: p ? "Edit " + esc(p.partNo) : "Add part number", wide: true, body: body, saveLabel: p ? "Save part" : "Add to store",
    onSave: function () {

        for (let i = 0; i < rows.length; i++) {

          corrections.push({ site: rows[i].site, bin: rows[i].bin, before: rows[i].qty, after: after });
        }

      if (newQty < 0) return "Quantity to add must be zero or more.";
      if (newQty > 0 && (!newSite || !newBin)) return "Choose a site and enter a rack or bin for the added quantity.";
      const payload = {
        partNo: no, name: val("pName"), category: val("pCat"), unit: val("pUnit") || "pcs",
        unitCost: newCost, updatedAt: nowISO(),
        min: Number(val("pMin")) || 0, max: Number(val("pMax")) || 0,
        notes: val("pNotes")

      if (p) {
        Object.assign(p, payload);
        corrections.forEach(function (c) {

          partLocAdd(p, c.site, c.bin, delta);

        });

function movementEditable(mv, p) {
  if (!mv || mv.serviceId) return false;

  return mv.ref === "OPENING" && !!(p && partLocRows(p)[0]);
}
function movementEditModal(id, returnPart) {
  if (!can("dataWrite")) { toast("Your role cannot edit stock movements.", "err"); return; }
  const mv = DB.moves.find(function (x) { return x.id === id; });
  if (!mv) { toast("That stock movement no longer exists.", "err"); return; }
  const p = partById(mv.partId);
  if (!p) { toast("The part for this movement no longer exists.", "err"); return; }
  if (!movementEditable(mv, p)) { toast("This movement is linked to a work order. Edit it from that work order.", "err"); return; }
  const firstLoc = partLocRows(p)[0] || {};
  const originalSite = (mv.site && mv.site !== "—") ? mv.site : (firstLoc.site || "");
  const originalBin = (mv.bin && mv.bin !== "—") ? mv.bin : (firstLoc.bin || "");
  const opening = !originalSite || !originalBin;
  const siteOpts = DB.settings.sites.slice();
  if (originalSite && siteOpts.indexOf(originalSite) < 0) siteOpts.unshift(originalSite);
  let vNames = vendorNames().filter(function (n, i, a) { return a.indexOf(n) === i; });
  if (mv.vendor && vNames.indexOf(mv.vendor) < 0) vNames.unshift(mv.vendor);
  const body = '<div class="info-box" style="margin-bottom:12px"><b>' + esc(p.partNo) + "</b> " + esc(p.name) +
      "<br>This edits the original " + mv.type + " movement. Quantity, date, site, bin, vendor and stock on hand are updated together; no correction line is added." +
      (opening ? " This is an opening balance, so the quantity is applied to the first holding location unless you choose another site and bin." : "") + "</div>" +
    '<div class="form-grid">' +
      fsel("mvType", "Movement type", [["IN", "Receipt (IN)"], ["OUT", "Issue (OUT)"]], mv.type) +
      fld("mvQty", "Quantity", mv.qty, "number") +
      fld("mvCost", "Unit cost", mv.unitCost === undefined ? p.unitCost : mv.unitCost, "number") +
      fld("mvDate", "Date", mv.date || todayISO(), "date") +
      fsel("mvSite", "Site store", siteOpts, originalSite || siteOpts[0]) +
      fld("mvBin", "Rack / bin / container", originalBin || "") +
      fsel("mvVendor", "Vendor / supplier", [["", "— not recorded —"]].concat(vNames.map(function (n) { return [n, n]; })), mv.vendor || "", false, "Changes this original stock movement only. The part master is not changed.") +
      fld("mvRef", "Invoice / GRN / reference", mv.ref || "") +
      fta("mvNotes", "Notes", mv.notes || "", 2, true) + "</div>";
  openModal({
    title: "Edit stock movement", wide: true, body: body, saveLabel: "Save movement",
    onSave: function () {
      const type = val("mvType") === "OUT" ? "OUT" : "IN";
      const qty = Number(val("mvQty")) || 0;
      if (qty <= 0) return "Enter a quantity greater than zero.";
      const cost = Number(val("mvCost"));
      if (!isFinite(cost) || cost < 0) return "Unit cost must be zero or more.";
      const date = val("mvDate") || todayISO();
      const site = val("mvSite");
      if (!site) return "Choose the site store.";
      const bin = String(val("mvBin") || "").trim();
      if (!bin) return "Enter the rack, bin or container.";
      const vendor = val("mvVendor");
      const oldType = mv.type === "OUT" ? "OUT" : "IN";
      const oldQty = Number(mv.qty) || 0;
      const oldSite = originalSite, oldBin = originalBin;
      const oldDelta = oldType === "IN" ? oldQty : -oldQty;
      const newDelta = type === "IN" ? qty : -qty;
      const key = function (s, b) { return String(s) + "\u0001" + String(b); };
      const shadow = {};
      partLocs(p).forEach(function (l) { shadow[key(l.site, l.bin)] = (shadow[key(l.site, l.bin)] || 0) + l.qty; });
      const oldKey = key(oldSite, oldBin), newKey = key(site, bin);
      shadow[oldKey] = (shadow[oldKey] || 0) - oldDelta;
      if (shadow[oldKey] < -0.0001) return "This movement cannot be changed because its original stock has already been issued or moved. Receive stock first, then edit it.";
      const available = shadow[newKey] || 0;
      shadow[newKey] = available + newDelta;
      if (shadow[newKey] < -0.0001) return "Only " + num(Math.max(0, available)) + " " + p.unit + " is available at " + site + " · " + bin + ".";
      partLocAdd(p, oldSite, oldBin, -oldDelta);
      partLocAdd(p, site, bin, newDelta);
      p.locs = partLocs(p).filter(function (l) { return Math.abs(l.qty) > 0.0001; });
      partSync(p);
      const vendorRef = vendors().filter(function (v) { return v.name === vendor; })[0] || {};
      Object.assign(mv, {
        type: type, qty: qty, unitCost: Math.round(cost * 100) / 100, date: date,
        site: site, bin: bin, vendor: vendor, vendorId: vendorRef.id || "",
        ref: val("mvRef"), notes: val("mvNotes"), updatedAt: nowISO()
      });
      audit("UPDATE", "part", p.id, "Edited stock movement " + p.partNo + ": " + type + " " + qty + " " + p.unit + " at " + site + " · " + bin + (vendor ? " from " + vendor : ""));
      toast("Stock movement updated" + (vendor ? " · " + vendor : ""), "ok");
      UI.view = "parts";
    },
    after: function () { if (returnPart) partDetail(p.id); }
  });
}

function deleteMovement(id, returnPart) {
  if (!can("del")) { toast("Your role cannot delete stock movements.", "err"); return; }
  const mv = DB.moves.find(function (x) { return x.id === id; });
  if (!mv) { toast("That stock movement no longer exists.", "err"); return; }
  const p = partById(mv.partId);
  if (!p) { toast("The part for this movement no longer exists.", "err"); return; }
  if (!movementEditable(mv, p)) { toast("This movement is linked to a work order. Delete it from that work order.", "err"); return; }
  const firstLoc = partLocRows(p)[0] || {};
  const oldSite = (mv.site && mv.site !== "—") ? mv.site : (firstLoc.site || "");
  const oldBin = (mv.bin && mv.bin !== "—") ? mv.bin : (firstLoc.bin || "");
  if (!oldSite || !oldBin) { toast("This movement has no stock location to reverse.", "err"); return; }
  const oldType = mv.type === "OUT" ? "OUT" : "IN";
  const oldQty = Number(mv.qty) || 0;
  const oldDelta = oldType === "IN" ? oldQty : -oldQty;
  const key = String(oldSite) + "\u0001" + String(oldBin);
  const shadow = {};
  partLocs(p).forEach(function (l) { shadow[String(l.site) + "\u0001" + String(l.bin)] = (shadow[String(l.site) + "\u0001" + String(l.bin)] || 0) + l.qty; });
  shadow[key] = (shadow[key] || 0) - oldDelta;
  if (shadow[key] < -0.0001) {
    toast("Cannot delete: only " + num(partLocRows(p).filter(function (l) { return l.site === oldSite && l.bin === oldBin; }).reduce(function (a, l) { return a + l.qty; }, 0)) + " " + p.unit + " is on hand at " + oldSite + " · " + oldBin + ". Some stock has already been issued.", "err");
    return;
  }
  const label = oldType + " " + num(oldQty) + " " + p.unit + " of " + p.partNo + " at " + oldSite + " · " + oldBin + (mv.vendor ? " from " + mv.vendor : "") + " dated " + (mv.date || "—");
  if (!confirm("Delete this stock movement?\n\n" + label + "\n\nOn-hand stock will be adjusted for this movement.")) return;
  partLocAdd(p, oldSite, oldBin, -oldDelta);
  p.locs = partLocs(p).filter(function (l) { return Math.abs(l.qty) > 0.0001; });
  partSync(p);
  DB.moves = DB.moves.filter(function (x) { return x.id !== id; });
  audit("DELETE", "part", p.id, "Deleted stock movement " + p.partNo + ": " + label);
  closeModal();
  UI.view = "parts";
  saveDB();
  render();
  if (returnPart) partDetail(p.id);
  toast("Stock movement deleted", "ok");
}

function pmDoneModal(id) {

      (isDays ? fld("dDate", "Date completed", todayISO(), "date") : "") +
      fld("dMeter", isDays ? "Meter reading at completion (" + meterLabel + ", optional)" : (isKm ? "Odometer / km at completion" : "Hour meter at completion"),
        currentMeter, "number", "Machine currently reads " + num(currentMeter) + " " + meterLabel + ". Enter the reading after this service; it becomes the machine's current reading.") +
      fld("dTech", "Technician / fitter", p.tech || TECHNICIANS[0]) +
      fld("dCost", "Service cost (" + currency + ")", "", "number") +
      fld("dRef", "Service / invoice reference", "") +
      fta("dParts", "Parts and consumables used", "", 2, true) +
      fta("dNotes", "Work performed and findings", "", 2, true) + "</div>";
  openModal({
    title: "Record PM completion", wide: true, body: body, saveLabel: "Mark done",
    onSave: function () {
      const date = isDays ? (val("dDate") || todayISO()) : todayISO();
      let meter = currentMeter;
      const meterRaw = val("dMeter");
      if (meterRaw === "") {
        if (!isDays) return "Enter the " + (isKm ? "odometer" : "meter") + " reading at completion.";
      } else {
        meter = Number(meterRaw);
        if (!isFinite(meter) || meter < 0) return "The meter reading must be a valid positive number.";
        if (meter < currentMeter) return "The reading cannot be lower than the current machine reading of " + num(currentMeter) + " " + meterLabel + ".";
      }
      const costRaw = val("dCost");
      let cost = 0;
      if (costRaw !== "") {
        cost = Number(costRaw);
        if (!isFinite(cost) || cost < 0) return "Service cost must be zero or a positive number.";
      }
      p.lastDate = date;
      p.lastMeter = meter;
      p.tech = val("dTech");
      p.notes = val("dNotes");
      p.lastParts = val("dParts");
      p.lastRef = val("dRef");
      p.lastCost = cost;
      p.lastCompletedAt = nowISO();
      p.active = true;
      if (isDays) p.nextDate = addDays(date, interval);
      else p.nextMeter = meter + interval;
      if (m && m.id && meter > currentMeter) {
        m.meter = meter;
        m.meterAt = date;
        m.updatedAt = nowISO();
      }
      if (m && m.id && isKm) m.meterType = "KM";
      const nextDue = isDays ? p.nextDate : num(p.nextMeter) + " " + pmUnitLabel(unit);
      const log = {
        id: uid("pml"), pmId: p.id, machineId: p.machineId, task: p.task,
        date: date, intervalType: unit, interval: interval, meter: meter,
        nextMeter: isDays ? "" : p.nextMeter, nextDate: isDays ? p.nextDate : "",
        technician: p.tech, parts: p.lastParts, cost: cost, ref: p.lastRef,
        notes: p.notes, site: m.site || "", createdAt: nowISO()
      };
      DB.pmLog.push(log);
      p.lastLogId = log.id;
      const doneAt = isDays ? " on " + date : " at " + num(meter) + " " + pmUnitLabel(unit);
      audit("PM", "pm", p.id, p.task + " completed on " + (m.code || "") + doneAt + " · next due " + nextDue + (cost ? " · " + money(cost) : ""));
      toast("PM recorded: " + p.task + " · next due " + nextDue, "ok");
      UI.view = "pm";
    }
  });
}

function sopEditModal(id) {
  if (!can("masterWrite")) { toast("Your role cannot edit procedures.", "err"); return; }
  const s = id ? DB.sops.find(function (x) { return x.id === id; }) : null;
  const stepsText = s ? s.steps.map(function (st) { return st[0] + " | " + st[1]; }).join("\n") : "";
  const cats = Array.from(new Set(DB.sops.map(function (x) { return x.cat; }).concat(["Operations", "Maintenance", "Fuel", "Stores", "HSE", "Reporting", "Administration", "Asset Control", "Cost Control"]))).sort();
  const scopes = s ? sopMachineTypes(s) : ["All machines"];
  const allScopes = scopes.length === 1 && scopes[0] === "All machines";
  const typeBoxes = machineTypeNames().map(function (t) {
    const checked = !allScopes && scopes.indexOf(t) >= 0;
    return '<label class="chk"><input type="checkbox" class="soScope" value="' + esc(t) + '"' + (checked ? " checked" : "") + (allScopes ? " disabled" : "") + "><span>" + esc(t) + "</span></label>";

    fld("soOwner", "Owner", s ? s.owner : "Fleet Manager") +
    fld("soRev", "Revision", s ? s.rev : "1.0") +

      if (!val("soTitle")) return "Title is required.";

        const parts = line.split("|");

      }).filter(function (x) { return x[0]; });
      if (!steps.length) return "At least one step is required.";
      const allBox = document.getElementById("soScopeAll");

      const scopeList = allBox && allBox.checked ? ["All machines"] : scopeBoxes.filter(function (b) { return b.checked; }).map(function (b) { return b.value; });

      b.disabled = !!isAll;
    });

    allBox.addEventListener("change", syncScopeBoxes);
    scopeBoxes.forEach(function (b) {

        if (b.checked && allBox) allBox.checked = false;
        syncScopeBoxes();
      });

/* ============================ 33. SETTINGS AND MASTER ACTIONS ============================ */
function saveSettings() {
  if (!can("settings")) return "Your role cannot change organisation settings.";
  const org = val("stOrg");
  if (!org) return "Organisation name is required.";
  DB.settings.org = org;
  DB.settings.symbol = val("stSymbol") || "$";
  DB.settings.currency = val("stCurrency") || "USD";
  DB.settings.defaultFuelPrice = Number(val("stFuel")) || 0;
  DB.settings.labourRate = Number(val("stLabour")) || 0;
  audit("UPDATE", "settings", "organisation", "Organisation settings saved");
  toast("Settings saved", "ok");
  return false;
}
function masterNameModal(kind, idx) {
  if (!can("settings")) { toast("Your role cannot change the site and department lists.", "err"); return; }
  const isSite = kind === "site";
  const list = isSite ? DB.settings.sites : DB.settings.departments;
  const old = idx >= 0 ? list[idx] : "";
  const label = isSite ? "Site location name" : "Department name";
  const body = '<div class="form-grid">' + fld("mnName", label, old, "text", isSite ? "Used on assets, store bins and daily logs" : "Used on assets and login roles") + "</div>" +
    '<div class="info-box"><b>Renaming updates existing records.</b> ' + (isSite ? "Every machine at this site, its store bin locations and daily logs move to the new name in one step." : "Every machine assigned to this department moves to the new name in one step.") + "</div>";
  openModal({
    title: (idx >= 0 ? "Edit " : "Add ") + (isSite ? "site location" : "department"), body: body, saveLabel: idx >= 0 ? "Save name" : "Add to list",
    onSave: function () {
      const name = val("mnName").trim();
      if (!name) return "Enter a name.";
      if (list.some(function (x, i) { return i !== idx && x.toLowerCase() === name.toLowerCase(); })) return "That name already exists in this list.";
      if (idx >= 0 && name !== old) {
        if (isSite) {
          DB.machines.forEach(function (m) {
            const hadSite = m.site === old, hadLoc = m.locationDetail === old;
            if (hadSite) m.site = name;
            if (hadLoc) m.locationDetail = name;
            if (hadSite || hadLoc) audit("LOCATION", "machine", m.id, "Site renamed " + old + " → " + name);
          });
          DB.parts.forEach(function (p) {
            (p.locs || []).forEach(function (l) { if (l.site === old) l.site = name; });
          });
          DB.meterLogs.forEach(function (l) { if (l.site === old) l.site = name; });
          DB.moves.forEach(function (mv) { if (mv.site === old) mv.site = name; });
          DB.fuel.forEach(function (f) { if (f.site === old) f.site = name; });
          DB.services.forEach(function (s) { if (s.site === old) s.site = name; });
        } else {
          DB.machines.forEach(function (m) { if (m.dept === old) m.dept = name; });
        }
        list[idx] = name;
      } else if (idx < 0) {
        list.push(name);
      }
      audit(idx >= 0 ? "UPDATE" : "CREATE", isSite ? "site" : "department", name, (idx >= 0 ? "Renamed " + old + " to " : "Added ") + name);
      UI.view = "admin"; UI.adminTab = "settings";
      toast((idx >= 0 ? "Name updated" : "Added") + ": " + name, "ok");
    }
  });
}
function removeMasterName(kind, idx) {
  if (!can("settings")) { toast("Your role cannot change the site and department lists.", "err"); return; }
  const isSite = kind === "site";
  const list = isSite ? DB.settings.sites : DB.settings.departments;
  const name = list[idx];
  if (!name) return;
  if (list.length <= 1) { toast("Keep at least one " + (isSite ? "site" : "department") + ".", "err"); return; }
  const used = isSite
    ? DB.machines.filter(function (m) { return m.site === name; }).length + DB.parts.filter(function (p) { return (p.locs || []).some(function (l) { return l.site === name; }); }).length
    : DB.machines.filter(function (m) { return m.dept === name; }).length;
  if (used) { toast("Cannot remove " + name + ": " + used + " active record" + (used === 1 ? "" : "s") + " still use it. Reassign them first.", "err"); return; }
  if (!confirm("Remove " + name + " from the " + (isSite ? "site" : "department") + " list?")) return;
  list.splice(idx, 1);
  audit("DELETE", isSite ? "site" : "department", name, "Removed " + name + " from the master list");
  saveDB();
  toast(name + " removed", "ok");
  render();
}

function machineMakesText(makes) {
  return (makes || []).map(function (p) { return p[0] + " | " + p[1]; }).join("; ");
}
function parseMachineMakes(raw) {
  return String(raw || "").split(/[;\n]+/).map(function (pair) {
    const txt = pair.trim();
    if (!txt) return null;
    const parts = txt.split("|");
    return [String(parts[0] || "Generic").trim() || "Generic", String(parts[1] || "Standard").trim() || "Standard"];
  }).filter(Boolean);
}
function machineTypeModal(idx) {
  if (!can("settings")) { toast("Your role cannot change the machine type list.", "err"); return; }
  const list = machineTypeList();
  const old = idx >= 0 ? list[idx] : null;
  const body = '<div class="form-grid">' +
    fld("mtName", "Machine type name", old ? old.name : "", "text", "Appears in the Add / Edit machine dropdown and the register filter") +
    fld("mtCat", "Category", old ? old.cat : "Earthmoving", "text", "Used for PM templates and reporting, for example Earthmoving, Transport or Support") +
    fsel("mtMeter", "Default meter type", ["Hours", "KM"], old ? old.meter : "Hours") +
    fld("mtExp", "Default standard consumption", old ? old.exp : 8, "number", "Litres per hour for plant, litres per kilometre for vehicles", ' step="0.1"') +
    fld("mtCode", "Code prefix", old ? old.code : "MC", "text", "Suggested asset code prefix, for example EX or DT") +
    fta("mtMakes", "Typical make / model", old ? machineMakesText(old.makes) : "Generic | Standard", 3, true) +
    "</div>" +
    '<div class="info-box"><b>One make and model per pair.</b> Separate pairs with a semicolon, for example <code style="font-family:var(--f-mono)">Caterpillar | 320D; Komatsu | PC210</code>. These are suggestions for new assets, not a fixed list. The code prefix is used for the suggested asset code when adding a machine.</div>';
  openModal({
    title: (idx >= 0 ? "Edit " : "Add ") + "machine type", body: body, saveLabel: idx >= 0 ? "Save type" : "Add to list",
    onSave: function () {
      const name = val("mtName").trim();
      const cat = val("mtCat").trim() || "Support";
      const code = val("mtCode").trim().toUpperCase() || "MC";
      if (!name) return "Enter a machine type name.";
      if (!/^[A-Z0-9]{1,8}$/.test(code)) return "Code prefix must be 1–8 letters or digits.";
      if (list.some(function (t, i) { return i !== idx && t.name.toLowerCase() === name.toLowerCase(); })) return "That machine type already exists.";
      const exp = Number(val("mtExp"));
      if (!Number.isFinite(exp) || exp < 0) return "Standard consumption must be zero or a positive number.";
      const next = {
        name: name, cat: cat, meter: val("mtMeter") === "KM" ? "KM" : "Hours",
        exp: exp, code: code, makes: parseMachineMakes(val("mtMakes"))
      };
      if (!next.makes.length) next.makes = [["Generic", "Standard"]];
      if (idx >= 0 && old) {
        const oldName = old.name, oldCat = old.cat;
        Object.assign(old, next);
        if (oldName !== name) {
          DB.machines.forEach(function (m) {
            if (m.type === oldName) {
              m.type = name;
              if (m.name && m.name.indexOf(oldName + " ") === 0) m.name = name + m.name.slice(oldName.length);
              audit("UPDATE", "machine", m.id, "Machine type renamed " + oldName + " → " + name);
            }
          });
          DB.sops.forEach(function (s) {
            const scopes = sopMachineTypes(s);
            if (scopes.indexOf(oldName) >= 0) {
              s.machineTypes = scopes.map(function (x) { return x === oldName ? name : x; });
              s.machineType = s.machineTypes.length === 1 ? s.machineTypes[0] : "";
              audit("UPDATE", "sop", s.id, "SOP machine type renamed " + oldName + " → " + name);
            }
          });
        }
        if (oldCat !== cat) {
          DB.machines.forEach(function (m) {
            if (m.type === name && m.category === oldCat) {
              m.category = cat;
              audit("UPDATE", "machine", m.id, "Machine category updated " + oldCat + " → " + cat);
            }
          });
        }
      } else {
        list.push(next);
      }
      audit(idx >= 0 ? "UPDATE" : "CREATE", "machine-type", name, (idx >= 0 ? "Saved machine type " + name : "Added machine type " + name));
      UI.view = "admin"; UI.adminTab = "settings";
      toast((idx >= 0 ? "Machine type updated" : "Machine type added") + ": " + name, "ok");
    }
  });
}
function removeMachineType(idx) {
  if (!can("settings")) { toast("Your role cannot change the machine type list.", "err"); return; }
  const list = machineTypeList();
  const t = list[idx];
  if (!t) return;
  if (list.length <= 1) { toast("Keep at least one machine type.", "err"); return; }
  const used = DB.machines.filter(function (m) { return m.type === t.name; }).length;
  if (used) { toast("Cannot remove " + t.name + ": " + used + " asset" + (used === 1 ? "" : "s") + " still use it. Change those machines first.", "err"); return; }
  const sops = DB.sops.filter(function (s) { return sopMachineTypes(s).indexOf(t.name) >= 0; }).length;
  if (sops) { toast("Cannot remove " + t.name + ": " + sops + " SOP" + (sops === 1 ? "" : "s") + " still target it. Reassign those procedures first.", "err"); return; }
  if (!confirm("Remove machine type " + t.name + " from the list?")) return;
  list.splice(idx, 1);
  audit("DELETE", "machine-type", t.name, "Removed machine type " + t.name + " from the master list");
  saveDB();
  toast(t.name + " removed", "ok");
  render();
}

function applyPmTemplates() {
  if (!can("masterWrite")) { toast("Your role cannot change the PM plan.", "err"); return; }
  let added = 0;
  DB.machines.forEach(function (m) {
    const has = DB.pm.some(function (p) { return p.machineId === m.id; });
    if (has) return;
    const tpl = PM_TEMPLATES[m.category] || PM_TEMPLATES.Support;
    tpl.slice(0, 3).forEach(function (t) {
      const isDays = t[1] === "Days";
      const interval = t[2];
      const lastMeter = Math.max(0, m.meter - Math.round(interval * (0.2 + Math.random() * 0.7)));
      DB.pm.push({
        id: uid("pm"), machineId: m.id, task: t[0],
        intervalType: isDays ? "Days" : (m.meterType === "KM" ? "KM" : "Hours"),
        interval: interval,
        lastMeter: lastMeter,
        nextMeter: isDays ? "" : lastMeter + interval,
        lastDate: isDays ? daysAgo(20) : "",
        nextDate: isDays ? addDays(todayISO(), Math.max(5, interval - 20)) : "",
        tech: TECHNICIANS[0], active: true, notes: ""
      });
      added++;
    });
  });
  audit("CREATE", "pm", "templates", added + " PM tasks created from templates");
  toast(added + " PM tasks added from templates", "ok");
  return false;
}

<script>
/* ============================ 34. REPORT SHEETS ============================ */
const REPORT = { csv: null, title: "" };

function rpKpis(items) {

    return '<div class="rp-kpi"><span>' + esc(it[0]) + "</span><b>" + it[1] + "</b></div>";
  }).join("") + "</div>";
}
function rpSign() {
  return '<div class="rp-sign"><div>Prepared by (workshop)</div><div>Reviewed by (fleet manager)</div><div>Approved by (operations)</div></div>';
}
function openReport(html, title, csvFn, htmlName) {
  closeReport();
  const el = document.createElement("div");
  el.id = "reportScreen";
  el.className = "report-screen";
  el.innerHTML = '<div class="report-toolbar"><div style="font-family:var(--f-display);font-size:13px;letter-spacing:.07em;text-transform:uppercase">' + esc(title) + "</div>" +
    '<span style="flex:1"></span>' +
    '<button class="btn btn-sm" data-act="print-report">' + ic("print") + " Print or save as PDF</button>" +
    (csvFn ? '<button class="btn btn-sm" data-act="csv-report">' + ic("download") + " Download CSV</button>" : "") +
    '<button class="btn btn-sm" data-act="download-report-html">Download HTML</button>' +
    '<button class="btn btn-sm" data-act="close-report">Close</button></div>' +

function downloadReportHTML() {

  const doc = "<!DOCTYPE html><html lang=\"en\"><head><meta charset=\"utf-8\"><title>" + esc(REPORT.title) + "</title>" +
    '<link rel="stylesheet" href="' + link + '"><style>' + css + "</style></head>" +

function closeReport() {

  if (el) el.remove();
  document.body.classList.remove("reporting");

}
function machineTimeline(m) {
  const events = [];
  fuelLogs(m.id).forEach(function (x) {
    events.push({ ts: x.date + "T00:00", date: x.date, type: "Fuel", ref: x.invoice || x.station || "Fuel slip", site: x.site || "",
      detail: num(x.liters, 1) + " L · " + (x.station || "—"), meter: num(x.meter) + " " + meterUnit(m), cost: Number(x.cost) || 0 });
  });
  serviceLogs(m.id).forEach(function (s) {
    const c = serviceCost(s);
    events.push({ ts: s.date + "T00:00", date: s.date, type: s.type === "Breakdown" ? "Breakdown" : "Work order", ref: s.wo || "—", site: s.site || "",
      detail: s.description + (s.technician ? " · " + s.technician : "") + (s.vendorName ? " · " + s.vendorName : ""), meter: num(s.downtime) + " h downtime", cost: c.total });
  });
  partMoves(m.id).forEach(function (mv) {
    const p = partById(mv.partId) || {};
    events.push({ ts: mv.date + "T00:00", date: mv.date, type: mv.type === "IN" ? "Part return" : "Part issue", ref: mv.ref || (p.partNo || "—"), site: mv.site || "—",
      detail: (p.partNo || "—") + " · " + (p.name || "Deleted part") + " · " + (mv.site || "—") + " / " + (mv.bin || "—"), meter: mv.qty + " " + (p.unit || ""), cost: Number(mv.qty * mv.unitCost) || 0 });
  });
  meterLogRows(m.id).forEach(function (l) {
    events.push({ ts: l.date + "T00:00", date: l.date, type: "Daily log", ref: l.shift || "Operational log", site: l.site || m.site,
      detail: (l.work || l.notes || "Shift record") + (l.operator ? " · " + l.operator : ""), meter: (l.openReading === null || l.openReading === undefined ? "—" : num(l.openReading)) + " → " + num(l.reading) + " " + meterUnit(m), cost: null });
  });
  const loggedPmIds = {};
  pmLogRows(m.id).forEach(function (l) {
    loggedPmIds[l.pmId] = 1;
    const unit = pmUnitKind(l.intervalType);
    const reading = unit === "Days" ? "meter " + num(l.meter) + " " + meterUnit(m) : num(l.meter) + " " + pmUnitLabel(unit);
    events.push({ ts: l.date + "T00:00", date: l.date, type: "PM done", ref: l.task, site: l.site || m.site,
      detail: (l.technician ? l.technician : "—") + " · interval " + num(l.interval) + " " + pmUnitLabel(unit) + " · next " + pmLogNextText(l) + (l.parts ? " · parts: " + l.parts : "") + (l.notes ? " · " + l.notes : ""),
      meter: reading, cost: Number(l.cost) || 0 });
  });
  DB.pm.filter(function (p) { return p.machineId === m.id && p.lastDate && !loggedPmIds[p.id]; }).forEach(function (p) {
    events.push({ ts: p.lastDate + "T00:00", date: p.lastDate, type: "PM done", ref: p.task, site: "",
      detail: p.task + (p.tech ? " · " + p.tech : ""), meter: p.intervalType === "Days" ? "—" : num(p.lastMeter) + " " + (p.intervalType === "KM" ? "km" : "h"), cost: null });
  });
  DB.audit.filter(function (a) { return a.entity === "machine" && a.entityId === m.id; }).forEach(function (a) {
    events.push({ ts: a.ts, date: String(a.ts || "").slice(0, 10), type: "Asset record", ref: a.action || "UPDATE", site: m.site, detail: a.detail || "", meter: "—", cost: null });
  });
  return events.sort(function (a, b) { return String(b.ts || "").localeCompare(String(a.ts || "")); });
}

function openDailyLogReport(machineId) {

      ["Idle hours", num(idle, 1)], ["Downtime hours", num(down, 1)], ["Movement per entry", total ? num(movement / total, 1) : "—"], ["Entries with downtime", num(downEntries)]

function exportCSV(name, headers, rows) {

}

    DB.machines.map(function (m) {
      const c = costStats(m, 365);
      return [m.code, m.type, m.category, m.make, m.model, m.serial, m.year, m.site, m.dept, m.operator, m.status,

function exportParts() {
  const rows = [];

    locs.forEach(function (l) {
      rows.push([p.partNo, p.name, p.category, p.unit, p.unitCost, l.site, l.bin, l.qty, p.stock, l.qty * p.unitCost, p.min, p.max]);

function exportServices() {

    DB.services.map(function (s) {
      const m = machineById(s.machineId) || {};
      const pt = sum(s.parts || [], function (p) { return p.qty * p.unitCost; });

function exportAllJSON() {
  const payload = { app: "BS Fleet OPS CMMS", version: DB.meta.version, exportedAt: nowISO(), org: DB.settings.org, records: DB.machines.length, db: DB };
  download("BS-Fleet-OPS-backup-" + todayISO() + ".json", JSON.stringify(payload, null, 1), "application/json");

function importJSONFile(file) {
  const reader = new FileReader();
  reader.onload = function () {
    let data = null;
    try { data = JSON.parse(String(reader.result)); } catch (e) { toast("That file is not valid JSON.", "err"); return; }
    const db = data && data.db ? data.db : data;
    if (!db || !Array.isArray(db.machines) || !Array.isArray(db.parts)) { toast("That file does not look like a BS Fleet OPS backup.", "err"); return; }
    if (!confirm("Restore this backup? It replaces all data on this device.\n\nMachines: " + db.machines.length + "\nParts: " + db.parts.length + "\nExport date: " + (data.exportedAt || "unknown"))) return;
    DB = hydrateDB(db);
    saveDB();
    if (!currentUser()) {
      SESSION = null;
      try { localStorage.removeItem(LS_SESSION); } catch (e) { /* ignore */ }
    } else {
      audit("IMPORT", "database", "json", "Restored backup with " + DB.machines.length + " machines");
      saveDB(true);
    }
    toast("Backup restored", "ok");
    render();
  };
  reader.onerror = function () { toast("Could not read that file.", "err"); };
  reader.readAsText(file);
}

/* ============================ 36. GOOGLE DRIVE SYNC ============================ */
const DRIVE = { token: "", expires: 0, client: null };
function gdSetState(msg, kind) {
  const el = document.getElementById("gdState");
  if (!el) return;
  el.innerHTML = '<span class="tag ' + (kind || "") + '">' + esc(msg) + "</span>";
}
function loadGIS() {
  return new Promise(function (resolve, reject) {
    if (window.google && google.accounts && google.accounts.oauth2) return resolve();
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.async = true;
    s.onload = function () { resolve(); };
    s.onerror = function () { reject(new Error("Google identity library could not load. Check the network or an ad blocker.")); };
    document.head.appendChild(s);
  });
}
async function gdriveConnect() {
  const clientId = val("gdClient") || (getSyncSettings().clientId || "");
  const folderId = val("gdFolder");
  if (!clientId) { toast("Add your OAuth Client ID first.", "err"); return; }
  setSyncSettings(Object.assign(getSyncSettings(), { clientId: clientId, folderId: folderId }));
  try { await loadGIS(); } catch (e) { toast(e.message, "err"); return; }
  try {
    DRIVE.client = google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: "https://www.googleapis.com/auth/drive.file",
      callback: function (resp) {
        if (resp.error) { gdSetState("Authorisation refused: " + resp.error, "bad"); toast("Google Drive authorisation failed", "err"); return; }
        DRIVE.token = resp.access_token;
        DRIVE.expires = Date.now() + (Number(resp.expires_in || 3600) - 60) * 1000;
        setSyncSettings(Object.assign(getSyncSettings(), { connected: true, connectedAt: nowISO() }));
        gdSetState("Connected to Google Drive", "ok");
        toast("Google Drive connected", "ok");
      }
    });
    DRIVE.client.requestAccessToken();
  } catch (e) {
    gdSetState("Connection failed", "bad");
    toast("Could not start Google authorisation: " + e.message, "err");
  }
}
async function gdrivePush() {
  if (!DRIVE.token || Date.now() > DRIVE.expires) { toast("Connect Google Drive first, the token is missing or expired.", "err"); return; }
  const cfg = getSyncSettings();
  gdSetState("Uploading snapshot", "warn");
  const payload = JSON.stringify({ app: "BS Fleet OPS CMMS", version: DB.meta.version, exportedAt: nowISO(), org: DB.settings.org, db: DB });
  try {
    let res;
    if (cfg.fileId) {
      res = await fetch("https://www.googleapis.com/upload/drive/v3/files/" + cfg.fileId + "?uploadType=media&fields=id,name,modifiedTime", {
        method: "PATCH", headers: { Authorization: "Bearer " + DRIVE.token, "Content-Type": "application/json" }, body: payload
      });
    } else {
      const meta = { name: "fleetops-backup.json", mimeType: "application/json", parents: [cfg.folderId || "appDataFolder"] };
      const boundary = "fleetops" + Date.now();
      const body = "--" + boundary + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" + JSON.stringify(meta) +
        "\r\n--" + boundary + "\r\nContent-Type: application/json\r\n\r\n" + payload + "\r\n--" + boundary + "--";
      res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,modifiedTime", {
        method: "POST",
        headers: { Authorization: "Bearer " + DRIVE.token, "Content-Type": "multipart/related; boundary=" + boundary },
        body: body
      });
    }
    if (!res.ok) throw new Error("Drive returned " + res.status + ": " + (await res.text()).slice(0, 120));
    const json = await res.json();
    if (json.id) setSyncSettings(Object.assign(getSyncSettings(), { fileId: json.id, lastPush: nowISO(), connected: true }));
    gdSetState("Snapshot uploaded " + nowISO(), "ok");
    toast("Snapshot pushed to Google Drive", "ok");
    audit("SYNC", "database", "gdrive", "Pushed snapshot to Google Drive");
    saveDB(true);
  } catch (e) {
    gdSetState("Upload failed", "bad");
    toast("Upload failed: " + e.message, "err");
  }
}
async function gdrivePull() {
  if (!DRIVE.token || Date.now() > DRIVE.expires) { toast("Connect Google Drive first, the token is missing or expired.", "err"); return; }
  const cfg = getSyncSettings();
  gdSetState("Reading snapshot", "warn");
  try {
    let fileId = cfg.fileId;
    if (!fileId) {
      const q = encodeURIComponent("name='fleetops-backup.json'");
      const spaces = cfg.folderId ? "" : "&spaces=appDataFolder";
      const listUrl = cfg.folderId
        ? "https://www.googleapis.com/drive/v3/files?q=" + q + "&fields=files(id,name,modifiedTime)&orderBy=modifiedTime desc"
        : "https://www.googleapis.com/drive/v3/files?q=" + q + spaces + "&fields=files(id,name,modifiedTime)&orderBy=modifiedTime desc";
      const lr = await fetch(listUrl, { headers: { Authorization: "Bearer " + DRIVE.token } });
      if (!lr.ok) throw new Error("Listing failed " + lr.status);
      const lj = await lr.json();
      if (!lj.files || !lj.files.length) throw new Error("No fleetops-backup.json found in that Drive folder.");
      fileId = lj.files[0].id;
    }
    const res = await fetch("https://www.googleapis.com/drive/v3/files/" + fileId + "?alt=media", { headers: { Authorization: "Bearer " + DRIVE.token } });
    if (!res.ok) throw new Error("Download failed " + res.status);
    const data = JSON.parse(await res.text());
    const db = data && data.db ? data.db : data;
    if (!db || !Array.isArray(db.machines)) throw new Error("That file is not a BS Fleet OPS database.");
    if (!confirm("Replace local data with the Drive snapshot?\n\nMachines: " + db.machines.length + "\nSaved: " + (data.exportedAt || "unknown"))) { gdSetState("Pull cancelled"); return; }
    DB = hydrateDB(db);
    setSyncSettings(Object.assign(getSyncSettings(), { fileId: fileId, lastPull: nowISO() }));
    saveDB();
    if (!currentUser()) {
      SESSION = null;
      try { localStorage.removeItem(LS_SESSION); } catch (e) { /* ignore */ }
    }
    gdSetState("Snapshot restored " + nowISO(), "ok");
    toast("Snapshot pulled from Google Drive", "ok");
    render();
  } catch (e) {
    gdSetState("Pull failed", "bad");
    toast("Pull failed: " + e.message, "err");
  }
}

/* ============================ 37. OPERATING GUIDE ============================ */
function openHelp() {
  const body = '<div class="sop-doc"><h2 style="font-family:var(--f-display);font-size:24px;text-transform:uppercase;margin-bottom:8px">How this register is run</h2>' +
    '<div class="sop-sec"><div class="sop-sec-h">1 · One code per machine</div><p class="small">Every machine gets one code, painted on the machine and used on every fuel slip, part issue and work order. If a machine is replaced, retire the code and create a new one; never reuse a code for a different asset.</p></div>' +
    '<div class="sop-sec"><div class="sop-sec-h">2 · Fuel is measured, not estimated</div><p class="small">Record the meter reading at each refuel. Consumption is the litres between two refuels divided by the meter movement. The standard consumption on the asset record is the benchmark; beyond 15% variance the fuel log raises an alarm. The dashboard watchlist ranks the worst machines by litres per km for vehicles and litres per hour for plant, and links each one to its record.</p></div>' +
    '<div class="sop-sec"><div class="sop-sec-h">3 · Parts move through the store</div><p class="small">Receipts increase stock, issues decrease it. A part issued on a work order is charged to that machine automatically. A direct issue needs the machine selected and the approval or job card reference, otherwise the cost cannot be attributed or defended. An unapproved work order cannot release parts: save it as pending without parts, approve it, then issue the parts.</p></div>' +
    '<div class="sop-sec"><div class="sop-sec-h">4 · Work orders close the loop</div><p class="small">Raise the order against the machine, select the vendor where the work is external, and record technician, hours, external cost, downtime and parts. Every order carries an approval state: Pending, Approved or Rejected. Approval is granted by a user with master-data rights and records the name and time; only an approved order can be completed. Completing the order releases the machine back to Active when nothing else is open.</p></div>' +
    '<div class="sop-sec"><div class="sop-sec-h">5 · PM runs on meter or calendar</div><p class="small">Every task has an interval in hours, kilometres or days. Completing a task moves the next due point forward by one interval, so the plan stays valid without rewriting it.</p></div>' +
    '<div class="sop-sec"><div class="sop-sec-h">6 · Reports and backups</div><p class="small">The dossier button on any machine produces the printable record set, plus a CSV of the same data. Reports holds eight packages: fixed asset register, repair and maintenance cost, fleet performance, fuel, stock, maintenance, servicing and the machine dossier. Back up the JSON weekly: Drive sync inside the app, or upload the file to MEGA and restore it on another device.</p></div>' +
    '<div class="sop-sec"><div class="sop-sec-h">7 · Hosting the app for a team</div><p class="small">Host this single HTML file on GitHub Pages, Netlify or Cloudflare Pages to get one HTTPS link. For shared records, create a Supabase workspace in Administration, Cloud sync and give each site the team join code; every signed-in user then reads and writes the same workspace, with revision checks and a 60-second pull. Without a cloud workspace each browser keeps its own local database, so export the JSON backup when you need to move records between devices.</p></div>' +
    '<div class="sop-sec"><div class="sop-sec-h">8 · Roles and what each person may see</div><p class="small">A role carries two things: the tabs a person can open, and the actions they may take inside them. Start from Administrator, Fleet Manager, Operator or Viewer, then create a custom role when a job needs a narrower view. Tick only the tabs that job uses: a data entry clerk can be limited to machines, fuel, work orders and PM without seeing the dashboard or the parts store; a parts officer can be limited to the store, work orders and reports without seeing fuel. Settings and user management are separate permissions, held by the administrator. The audit log records who did what.</p></div>' +
    '<div class="sop-sec"><div class="sop-sec-h">9 · Daily machine and operational log</div><p class="small">At every shift, or once a day for machines in use, record a daily log: opening and closing hour meter or odometer, idle and breakdown hours, the work performed and any issue. The closing reading is shown in the machine register and becomes the meter used by PM due points; a lower reading is rejected. The Daily log tab and Daily log report show shift use, idle, downtime and activity by machine. Each machine keeps its latest 24 entries in browser storage; export the CSV or print the report before old entries are replaced.</p></div>' +
    '<div class="sop-sec"><div class="sop-sec-h">10 · Reading the screen</div><p class="small">Text size is a personal control in the sidebar footer (90, 100, 110 or 120%). It is stored per browser, so a user on a small screen can enlarge the interface without changing anyone else. Print and PDF output always stays at 100%.</p></div>' +
    '<div class="sop-sec"><div class="sop-sec-h">11 · Fixed asset control</div><p class="small">Each asset carries its code, site, location detail, physical condition, named custodian and the date it was last verified at that site. Condition and operating status are separate: a machine can be Active and still be in Poor condition. Site locations and departments are managed lists under Administration, Organisation; add, rename or remove them there and every asset, store and log dropdown updates together. The Fixed asset register report reconciles the register to finance, counts assets by site, flags condition exceptions, missing custodians and assets not verified in 90 days. Follow SOP-12 for tagging, transfer, quarterly verification and disposal.</p></div>' +
    '<div class="sop-sec"><div class="sop-sec-h">12 · Vendors and maintenance cost</div><p class="small">Every vendor is a profile, not just a name: type, national or international scope, approval status, rating, lead time, latest quotation, review date and services covered. Service vendor profiles are listed below the work order table; the full list, including parts suppliers, stays in Administration. Repair vendors are selected on the work order and their external cost is recorded separately from internal labour and parts. The Repair and maintenance cost report shows spend by site and by vendor, external share, downtime and profile quality. Cost reduction initiatives are recorded in Reports with a baseline, target, owner and validated saving; SOP-13, SOP-14 and SOP-15 define the vendor review, approval and saving evidence rules.</p></div>' +
    '<div class="sop-sec"><div class="sop-sec-h">13 · Stock receipts and site Excel files</div><p class="small">Vendor details are captured only when stock is received. Use Receive stock and choose the vendor from the dropdown, with the quantity, unit cost, receipt date, invoice or GRN, site and bin in the same entry. The vendor is stored on that stock movement and appears in Recent stock movements and the part movement history; it does not overwrite the part master. Use Edit on a movement to change the original quantity, date, site, bin, invoice reference or vendor in one step; the on-hand stock is adjusted with it and no correction line is added. Delete removes that original movement and reverses its stock effect; a receipt cannot be deleted once its stock has been issued. Work-order part usage and OPENING balances are edited from their source instead. The Add part form, spare-parts list and part detail show stock, locations and movements only, with no vendor field, Supply button or supply-history panel. Use Excel import on Spare parts to load the 25 site files: the importer maps headings, previews the rows, updates existing part numbers and writes stock receipts when the receipt option is ticked. Qty/Quantity is the delivered quantity and Stock/On Hand is the counted site balance. Use Excel import on Machine register for asset files; headings that are not standard fields, such as Power or Capacity, are kept as specifications on the asset and appear in its Specification panel and dossier. Nothing is written until Import is pressed, and a field missing from the file is left unchanged.</p></div>' +
    "</div>";
  openModal({ title: "Operating guide", wide: true, body: body, hideSave: true });
}

    case "apply-pm": if (requirePerm("masterWrite")) { applyPmTemplates(); render(); } return;
    case "export-pm": exportPm(); return;
    case "add-sop": sopEditModal(""); return;
    case "edit-sop": closeModal(); sopEditModal(id); return;
    case "print-sop": closeModal(); openSopPrint(id); return;
    case "print-sop-index": openSopIndex(); return;
    case "fleet-report": openFleetReport(); return;
    case "stock-report": openStockReport(); return;
    case "asset-register-report": openAssetRegisterReport(); return;
    case "cost-report": openCostReport(); return;
    case "add-initiative": initiativeModal(""); return;
    case "edit-initiative": initiativeModal(id); return;
    case "export-dashboard": exportDashboardSummary(); return;
    case "export-all-json": exportAllJSON(); return;
    case "import-json": {
      const f = document.getElementById("importFile");
      if (f) f.click(); else toast("Open the Data tools tab to restore a backup.", "err");
      return;
    }
    case "add-user": userModal(""); return;
    case "add-role": roleModal(""); return;
    case "edit-role": if (requirePerm("settings")) roleModal(id); return;
    case "del-role": {
      if (!requirePerm("settings")) return;
      const r = roles().filter(function (x) { return x.id === id; })[0];
      if (!r || r.builtin) { toast("Built in roles cannot be removed.", "err"); return; }
      if (DB.users.some(function (u) { return u.role === id; })) { toast("Move the users on this role to another role first.", "err"); return; }
      if (!confirm("Remove role " + r.label + "?")) return;
      DB.settings.roles = roles().filter(function (x) { return x.id !== id; });
      audit("DELETE", "role", id, "Removed role " + r.label);
      saveDB(); render(); toast("Role removed", "ok");
      return;
    }
    case "edit-user": userModal(id); return;
    case "reset-pass": resetPassModal(id); return;
    case "toggle-user": toggleUser(id); return;
    case "save-settings": if (requirePerm("settings")) { const err = saveSettings(); if (err) toast(err, "err"); else render(); } return;
    case "add-site": masterNameModal("site", -1); return;
    case "edit-site": masterNameModal("site", Number(id)); return;
    case "del-site": removeMasterName("site", Number(id)); return;
    case "add-dept": masterNameModal("dept", -1); return;
    case "edit-dept": masterNameModal("dept", Number(id)); return;
    case "del-dept": removeMasterName("dept", Number(id)); return;
    case "add-machine-type": machineTypeModal(-1); return;
    case "edit-machine-type": machineTypeModal(Number(id)); return;
    case "del-machine-type": removeMachineType(Number(id)); return;
    case "set-scale": {
      const v = Math.max(0.9, Math.min(1.3, Number(el.getAttribute("data-v")) || 1));
      applyUIScale(v);
      try { localStorage.setItem(LS_SCALE, String(v)); } catch (e) { /* ignore */ }
      if (can("settings")) { DB.settings.uiScale = v; saveDB(); }
      render(); toast("Text size " + Math.round(v * 100) + "%", "ok");
      return;
    }
    case "add-vendor": vendorModal(null, (el && el.getAttribute("data-kind")) || "Parts supplier"); return;
    case "edit-vendor": vendorModal(id); return;
    case "del-vendor": { const v = vendors().filter(function (x) { return x.id === id; })[0]; if (!v) return;
      if (!can("masterWrite")) { toast("Your role cannot change vendors.", "err"); return; }
      if (!confirm("Remove vendor " + v.name + "? Historical stock receipts and work orders keep the vendor name.")) return;
      DB.settings.vendors = vendors().filter(function (x) { return x.id !== id; }); audit("DELETE", "vendor", id, "Removed vendor " + v.name); saveDB(); render(); toast("Vendor removed", "ok"); return; }
    case "generate-fleet": generateFleet(); return;
    case "prune-fuel": pruneFuel(); return;
    case "wipe-db": wipeDB(); return;
    case "gdrive-connect": gdriveConnect(); return;
    case "gdrive-push": gdrivePush(); return;
    case "gdrive-pull": gdrivePull(); return;
    case "cloud-save": cloudSaveFromForm(); return;
    case "cloud-sync": cloudSync({ manual: true }); return;
    case "cloud-upload": cloudUploadAll(); return;
    case "cloud-pull": cloudPullReplace(); return;
    case "cloud-code": cloudOpenCode(); return;
    case "copy-team-code": cloudCopyCode(); return;
    case "save-notes": {
      const m = machineById(id);
      if (!m) return;
      m.notes = val("mNotes");
      m.updatedAt = nowISO();
      audit("UPDATE", "machine", m.id, "Notes updated on " + m.code);
      saveDB();
      toast("Notes saved", "ok");
      return;
    }
    case "print-report": window.print(); return;
    case "close-report": closeReport(); return;
    case "csv-report": if (REPORT.csv) REPORT.csv(); return;
    case "download-report-html": downloadReportHTML(); return;
    default: toast("That action is not available.", "err");
  }
}
function toggleUser(id) {
  if (!can("users")) { toast("Only the administrator can change accounts.", "err"); return; }
  const u = DB.users.find(function (x) { return x.id === id; });
  if (!u) return;
  const me = currentUser();
  if (me && me.id === u.id) { toast("You cannot disable your own account.", "err"); return; }
  u.active = !u.active;
  audit("UPDATE", "user", u.id, (u.active ? "Enabled " : "Disabled ") + u.username);
  saveDB();
  toast(u.name + (u.active ? " enabled" : " disabled"), "ok");
  render();
}
function deleteService(id) {
  if (!can("del")) { toast("Your role cannot delete records.", "err"); return; }
  const s = DB.services.find(function (x) { return x.id === id; });
  if (!s) return;
  if (!confirm("Delete work order " + s.wo + "? Parts issued on it are returned to stock.")) return;
  (s.parts || []).forEach(function (p) {
    const part = partById(p.partId);
    if (part) partLocAdd(part, p.site || (machineById(s.machineId) || {}).site || DB.settings.sites[0], p.bin || "RETURN", p.qty);
  });
  DB.moves = DB.moves.filter(function (mv) { return mv.serviceId !== id; });
  DB.services = DB.services.filter(function (x) { return x.id !== id; });
  audit("DELETE", "service", id, "Deleted " + s.wo);
  saveDB();
  closeModal();
  toast("Work order deleted, stock restored", "ok");
  UI.view = "machine"; UI.params = { id: s.machineId };
  render();
}
function generateFleet() {
  if (!can("masterWrite")) { toast("Your role cannot regenerate the fleet.", "err"); return; }
  const n = Number(val("genCount")) || 500;
  if (!confirm("Regenerate " + n + " machines? All current machines, fuel, parts movements and work orders will be replaced. User accounts are kept.")) return;
  seedDatabase(clamp(n, 1, 2000), true);
  audit("SEED", "database", "demo", "Regenerated demo fleet with " + n + " machines");
  saveDB();
  const kb = Math.round(dbBytes() / 1024);
  toast("Demo fleet regenerated · " + kb + " KB in local storage", "ok");
  if (dbBytes() > 4200000) toast("This device is close to the browser storage limit. Prune fuel history or export a backup before adding more.", "err");
  UI.view = "dashboard";
  render();
}
function pruneFuel() {
  if (!can("del")) { toast("Your role cannot prune records.", "err"); return; }
  const cut = daysAgo(730);
  const before = DB.fuel.length;
  DB.fuel = DB.fuel.filter(function (f) { return f.date >= cut; });
  const removed = before - DB.fuel.length;
  audit("DELETE", "fuel", "prune", removed + " fuel entries older than 24 months removed");
  saveDB();
  toast(removed + " fuel entries removed", "ok");
  render();
}
function wipeDB() {
  if (!can("settings")) { toast("Only the administrator can erase the database.", "err"); return; }
  if (!confirm("Erase every machine, part, record and user on this device? Export a backup first.")) return;
  if (!confirm("This cannot be undone. Erase now?")) return;
  try { localStorage.removeItem(LS_DB); localStorage.removeItem(LS_SESSION); localStorage.removeItem(LS_SYNC); } catch (e) { /* ignore */ }
  DB = blankDB();
  SESSION = null;
  toast("All data erased", "ok");
  render();
}

/* ============================ 39. AUTH FLOWS ============================ */
async function doLoginFlow() {
  const user = val("liUser"), pass = val("liPass");
  const errBox = document.getElementById("authErr");
  if (errBox) errBox.innerHTML = "";
  const res = await doLogin(user, pass);
  if (!res.ok) {
    if (errBox) errBox.innerHTML = '<div class="form-error">' + esc(res.msg) + "</div>";
    return;
  }
  audit("AUTH", "user", res.user.id, "Signed in");
  saveDB(true);
  UI.view = "dashboard";
  render();
  toast("Signed in as " + res.user.name, "ok");
}
function doSetupFlow() {
  const org = val("suOrg") || "Fleet Operations";
  const name = val("suName") || "Administrator";
  const username = (val("suUser") || "admin").toLowerCase();
  const pass = val("suPass");
  const count = Number(val("suCount")) || 0;
  const errBox = document.getElementById("authErr");
  if (errBox) errBox.innerHTML = "";
  if (!/^[a-z0-9._-]{3,}$/.test(username)) { if (errBox) errBox.innerHTML = '<div class="form-error">Username must be at least 3 characters, letters, digits, dot or dash.</div>'; return; }
  if (pass.length < 4) { if (errBox) errBox.innerHTML = '<div class="form-error">Password must be at least 4 characters.</div>'; return; }
  if (!CLOUD.joined) { CLOUD = blankCloud(); saveCloud(); }
  seedDatabase(count, false);
  DB.settings.org = org;
  DB.users = [{ id: uid("u"), name: name, username: username, role: "admin", pass: hashPwSync(pass), active: true, createdAt: nowISO(), lastLogin: nowISO() }];
  SESSION = { userId: DB.users[0].id };
  try { localStorage.setItem(LS_SESSION, JSON.stringify(SESSION)); } catch (e) { /* ignore */ }
  audit("CREATE", "database", "workspace", "Workspace created for " + org + " with " + count + " machines");
  saveDB();
  UI.view = "dashboard";
  render();
  toast("Workspace created", "ok");
}

/* ============================ 40. EVENT WIRING ============================ */
let filterTimer = null;
function setFilter(key, el) {
  if (!UI.filters) UI.filters = {};
  if (el.type === "checkbox") UI.filters[key] = el.checked;
  else UI.filters[key] = el.value;
  UI.page = 1;
}
function refocusFilter(key) {
  const el = document.querySelector('[data-f="' + key + '"]');
  if (el && el.tagName === "INPUT") {
    el.focus();
    const v = el.value;
    try { el.setSelectionRange(v.length, v.length); } catch (e) { /* ignore */ }
  }
}
function bindReportSearch() {
  const el = document.getElementById("reportSearch");
  if (!el) return;
  el.addEventListener("input", function () {
    UI.filters.q = el.value;
    rerenderView();
    const again = document.getElementById("reportSearch");
    if (again) { again.focus(); try { again.setSelectionRange(again.value.length, again.value.length); } catch (e) { /* ignore */ } }
  });
}
function wireEvents() {
  document.addEventListener("click", function (e) {
    const t = e.target;
    if (!t || !t.closest) return;
    const actEl = t.closest("[data-act]");
    if (actEl) {
      e.preventDefault();
      const act = actEl.getAttribute("data-act");
      if (act === "del-part-row") {
        const row = actEl.closest(".part-row");
        if (row && row.parentNode) row.parentNode.removeChild(row);
        return;
      }
      handleAction(act, actEl, actEl.getAttribute("data-id") || "");
      return;
    }
    const navEl = t.closest("[data-nav]");
    if (navEl) { navigate(navEl.getAttribute("data-nav")); closeRail(); return; }
    const mEl = t.closest("[data-machine]");
    if (mEl) { navigate("machine", { id: mEl.getAttribute("data-machine") }); closeRail(); return; }
    const pgEl = t.closest("[data-page]");
    if (pgEl) { UI.page = Number(pgEl.getAttribute("data-page")) || 1; render(); window.scrollTo(0, 0); return; }
    const tabEl = t.closest("[data-tab]");
    if (tabEl) {
      UI.tab = tabEl.getAttribute("data-tab");
      const v = document.getElementById("view");
      if (v) { v.innerHTML = viewHTML(); window.scrollTo(0, 0); }
      return;
    }
    const atEl = t.closest("[data-atab]");
    if (atEl) { UI.adminTab = atEl.getAttribute("data-atab"); render(); return; }
    const sopEl = t.closest("[data-sop]");
    if (sopEl) { sopView(sopEl.getAttribute("data-sop")); return; }
    const svEl = t.closest("[data-service]");
    if (svEl) { serviceModalView(svEl.getAttribute("data-service")); return; }
    const clEl = t.closest("[data-close]");
    if (clEl) { closeModal(); return; }
  });
  document.addEventListener("change", function (e) {
    const el = e.target;
    if (!el || !el.getAttribute) return;
    const key = el.getAttribute("data-f");
    if (key) { setFilter(key, el); rerenderView(); return; }
    if (el.id === "importFile" && el.files && el.files[0]) importJSONFile(el.files[0]);
    if (el.id === "excelImportFile" && el.files && el.files[0]) { handleExcelFile(el.files[0]); return; }
    if (el.getAttribute("data-excel-map") !== null && IMPORT) {
      if (el.value) {
        const i = Number(el.getAttribute("data-excel-map"));
        Object.keys(IMPORT.mapping).forEach(function (k) { if (Number(k) !== i && IMPORT.mapping[k] === el.value) delete IMPORT.mapping[k]; });
        IMPORT.mapping[i] = el.value;
      } else delete IMPORT.mapping[Number(el.getAttribute("data-excel-map"))];
      renderExcelPreview();
      return;
    }
  });
  document.addEventListener("input", function (e) {
    const el = e.target;
    if (!el || !el.getAttribute) return;
    const key = el.getAttribute("data-f");
    if (!key) return;
    if (el.tagName === "INPUT" && (el.type === "text" || el.type === "search")) {
      setFilter(key, el);
      clearTimeout(filterTimer);
      filterTimer = setTimeout(function () { rerenderView(); refocusFilter(key); }, 260);
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeModal(); closeReport(); }
    if (e.key === "Enter") {
      if (e.target && e.target.id === "globalSearch") {
        const q = e.target.value.trim();
        UI.view = "machines"; UI.filters = { q: q }; UI.page = 1;
        render();
        return;
      }
      const f = e.target && e.target.getAttribute && e.target.getAttribute("data-f");
      if (f) { clearTimeout(filterTimer); rerenderView(); refocusFilter(f); }
      if (e.target && e.target.id === "liPass") doLoginFlow();
    }
  });
}

/* ============================ 41. BOOT ============================ */
function boot() {
  DB = loadDB();
  try { SESSION = JSON.parse(localStorage.getItem(LS_SESSION) || "null"); } catch (e) { SESSION = null; }
  applyUIScale(Number(localStorage.getItem(LS_SCALE)) || (DB.settings && DB.settings.uiScale) || 1);
  wireEvents();
  render();
  cloudStart();
}
window.FleetOps = {
  get db() { return DB; },
  importMachinesCSV: function (text) {
    const lines = String(text || "").split(/\r?\n/).filter(function (l) { return l.trim(); });
    let added = 0, skipped = 0;
    lines.forEach(function (line) {
      if (/^code\s*,/i.test(line)) return;
      const c = line.split(",").map(function (x) { return x.trim(); });
      if (!c[0]) return;
      if (DB.machines.some(function (m) { return m.code.toLowerCase() === c[0].toLowerCase(); })) { skipped++; return; }
      const info = typeInfo(c[2] || "Excavator");
      DB.machines.push({
        id: uid("m"), code: c[0], name: (c[2] || "Machine") + " " + (c[5] || ""), type: c[2] || "Excavator",
        category: c[3] || info.cat, make: c[4] || "—", model: c[5] || "—", serial: c[6] || "—",
        year: Number(c[7]) || new Date().getFullYear(), meterType: c[8] || info.meter, meter: Number(c[9]) || 0,
        site: c[10] || DB.settings.sites[0], dept: c[11] || DB.settings.departments[0], operator: c[12] || OPERATORS[0],
        status: c[13] || "Active", fuelType: "Diesel", tank: Number(c[14]) || 300, expCons: Number(c[15]) || info.exp,
        purchaseDate: todayISO(), purchaseCost: 0, notes: "", createdAt: nowISO(), updatedAt: nowISO()
      });
      added++;
    });
    if (added) { audit("CREATE", "machine", "import", added + " machines imported from CSV"); saveDB(); render(); }
    return { added: added, skipped: skipped };
  },
  exportBackup: exportAllJSON
};
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
